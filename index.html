steaks into strips 5 mm thick and coat them with one portion of the adobo (the weekly batch is in the notes). For a single portion: stir 2 tsp pul biber and 1 tsp Paprika edelsüß into 1 tbsp of just-boiled water and leave 5 min, then mix in 2 tsp apple vinegar, 1 tbsp of the juice from the pineapple can, ½ grated garlic clove and ½ tsp oregano to a thick paste; taste it before adding any salt, because pul biber is usually salted. Fridge overnight (at least 4 h). Salsa: char 70 g Datteltomaten and 1 unpeeled garlic clove 8–10 min in the air fryer at 200 °C with 60 g Spitzpaprika, whole, beside them; peel the garlic and blend it with the tomatoes, ~0,5 g **chiltepín** (about 5 pods, toasted and crushed; start with 3) and a pinch of salt. Dress the blistered Spitzpaprika with 5 ml lime juice, a few drops of soy sauce and salt: those are the chiles toreados. Heat a pan until very hot with 5 ml rapeseed oil, spread the pork out and leave it 2 min without moving, then toss 1–2 min more until the edges are nearly black; add 48 g Ananas-Stücke for the last minute so they brown, then chop everything small on the board. Gringas: scatter 35 g Mozzarella gerieben over one half of each of 3 Protein-Wraps (120 g), add the pastor and pineapple, fold, and press 60–90 s a side in the dry pan until crisp and the cheese has melted. Open them and add 40 g onion, diced fine, 4 g chopped cilantro and the other 5 ml lime juice; spoon the salsa on as you eat.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 5 slices (187,5 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with half an apple (70 g)."},"notes":[{"title":"Why this menu","text":"**A gringa is al pastor and melted cheese in a flour tortilla, so the wrap is the right tortilla here.** Al pastor descends from the shawarma that Lebanese immigrants brought to Puebla: pork in a red adobo, roasted on a vertical spit with pineapple. Gran Receta's home version blends toasted guajillo and ancho chiles with achiote paste, pineapple juice, vinegar, garlic and spices, coats 1 kg of pork shoulder cut 5 mm thick, rests it 12 h, and sears it in small batches on maximum heat, 2 min without moving. **The adobo uses your acı pul biber in place of the guajillo and ancho.** It is scaled from that recipe, which takes per 1 kg of pork 62 g of dried chiles, 50 g of achiote paste, 120 ml pineapple juice, 60 ml vinegar, 3 garlic cloves, oregano, cumin and 2 cloves; here ~30 g of flakes go on the 800 g pack, bloomed in hot water and blended to a paste, and Paprika edelsüß stands in for the achiote's colour, the substitute the source itself gives. Pul biber is an Aleppo-type flake: fruity like guajillo, often hotter (published figures run from ~2.500 to ~10.000 Scoville against ~5.000 for guajillo and ~1.000 for ancho), and usually packed with a little salt and oil, so salt the paste only after tasting it. What is still missing is the earthy note of achiote and the cumin and cloves of the original: if you have them, add ½ tsp ground cumin (kimyon) and 2 cloves to the weekly batch. **If Cristina's Colmado has achiote paste, tell me the pack size and price and it goes in.** Thin Minutensteaks replace shoulder because they are already cut for it and are the cheaper lean pork. **Packs, all used up in the week:** the 800 g XXL steak pack (7 × 114 g), mozzarella (7 × 35 g), one can of pineapple (340 g drained, 7 × 48 g, and its juice for the adobo), Datteltomaten and one pack of Spitzpaprika. The chiles toreados are there for the vitamin C as much as for the plate: without them this day has ~30 mg. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~15 mg, zinc ~15 mg, calcium ~990 mg, magnesium ~535 mg, vitamin C ~105 mg, folate ~390 µg."},{"title":"Weekly schedule","text":"Shopping day, adobo for the week: put 4½ tbsp pul biber (~30 g) and 2 tbsp Paprika edelsüß in a tall cup, pour 100 ml of just-boiled water over them and leave 10 min. Add 70 ml apple vinegar, 100 ml of the juice from the pineapple can, 3 garlic cloves and 1 tbsp oregano and blend 1 min with the stick blender to a thick, smooth paste; taste, then salt (up to 1 tsp). Slice the whole 800 g pack, coat it with the paste and split it into 7 bags of ~125 g; 2 in the fridge, 5 frozen flat, each moved to the fridge the evening before. The meat marinates as it thaws. Tip the drained pineapple into a jar: it keeps 5 days in the fridge, so freeze the last 2 portions. The salsa can be made for 3–4 days at once. Searing the pork smokes: open the window."},{"title":"Carry to uni","text":"Fold and press the 3 gringas in the evening while the pastor is hot, so the cheese seals them; cool, wrap in foil, fridge overnight, and eat them cold. The onion, cilantro and lime go into the salsa jar, and the chiles toreados into the same box."},{"title":"Food safety","text":"Pork must be cooked through: no pink, juices clear. Cool cooked meat and beans spread out and box them in the fridge within 1 h; eat fridge portions within 3 days and freeze the rest flat on the day they are cooked. Thaw frozen portions in the fridge overnight, reheat once only, until steaming throughout. A carried lunch leaves the fridge with a frozen cool pack and is eaten within ~4 h; bin what is left."},{"title":"Air fryer & chiltepín","text":"The air-fryer times are estimates `[INFERENCE]` for a basket of 5 L or more and have not been tested on your model: look at the lower time and go by colour. Chiltepín is brutally hot: start with the smaller number of pods, taste a drop, then add. Toast the pods 15 s in a dry pan (open the window), crush them with the back of a spoon, wash your hands and keep them away from your eyes."}]},{"id":"X","name":"Tacos de pescado estilo Baja","knob":"seelachs","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"seelachs":214,"paniermehl":25,"chipotleMayo":25,"proteinWrap":120,"redCabbage":100,"tomato":70,"onion":20,"cilantro":4,"lime":10},"lock":{"bread":225,"oil":5,"veg":0,"solveKnob":false},"hue":215,"family":"seafood","mealOf":{"oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":150},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Tacos de pescado estilo Baja with crema de chipotle, col & pico de gallo** — Thaw 214 g Alaska-Seelachsfilet overnight in the fridge, press it dry between sheets of kitchen paper, cut it into finger-wide strips and salt them. Brush the strips thinly with 10 g Chipotle-Mayo, then press them into 25 g Paniermehl mixed with ½ tsp Paprika edelsüß. Brush the air-fryer basket and the top of the fish with 5 ml rapeseed oil and cook 8–10 min at 200 °C, turned once, until golden and crisp. Shred 100 g red cabbage as fine as you can and toss it with a pinch of salt and 5 ml lime juice. Pico de gallo: dice 70 g Datteltomaten and 20 g onion fine and mix with 4 g chopped cilantro, the other 5 ml lime juice, salt and 2–3 crushed **chiltepín** pods. Warm 3 Protein-Wraps (120 g) 20 s a side in a dry pan and build: cabbage, fish, a zigzag of the remaining 15 g Chipotle-Mayo, pico de gallo.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 4 slices (150 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with half an apple (70 g)."},"notes":[{"title":"Why this menu","text":"**The Ensenada fish taco: crisp white fish, raw cabbage, a creamy sauce and pico de gallo.** Casa de México's recipe for 8 uses 1 kg of white fish in a beer batter seasoned with paprika and garlic, deep-fried, with 4 cups of shredded cabbage, 1 cup of crema, pico de gallo with serrano, and 24 tortillas of corn or flour. **What is different here:** a breadcrumb coat in the air fryer instead of batter in a pot of oil, so the fish is crisp but not puffed like a real capeado; Chipotle-Mayo is both the glue for the crumbs (no egg needed) and the crema; chiltepín replaces the serrano. **Fish:** Alaska Seelachs (1 kg TK, €6,29, 65 kcal and 15 g protein per 100 g) is the flaky white fish these tacos are made of; 14 × 214 g is 2996 g, so **3 packs last two weeks**. Red cabbage is sold loose (€0,88/kg): 700 g a week, and a cut head keeps about 3 weeks wrapped in the fridge. Paniermehl (1 kg, €1,49) lasts 5–6 weeks. Chipotle-Mayo is weighed in grams (the 250 ml bottle holds roughly 235 g `[INFERENCE]`); it is the only chipotle product Aldi lists. The fillets may carry ice glaze: weigh a thawed, dried portion once `[INFERENCE]`. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~15 mg, zinc ~12 mg, calcium ~790 mg, magnesium ~560 mg, vitamin C ~80 mg, folate ~375 µg; zinc, calcium and vitamin C are under the DGE figures (16 mg, 1000 mg, 110 mg)."},{"title":"Weekly schedule","text":"Move the next day's 214 g from the freezer to the fridge each evening. The cabbage can be shredded for 3 days at once and kept undressed in a box; dress it just before eating. Pico de gallo is made daily: it weeps within a day. Crumbing and cooking the fish takes 15 min."},{"title":"Carry to uni","text":"Crumbed fish loses its crunch in a closed box, so this menu is best on days at home. To carry it: cook the fish in the morning, let it cool uncovered for 10 min, and pack it on kitchen paper in its own box with a frozen cool pack; cabbage, pico de gallo, the Chipotle-Mayo in a small jar and the wraps go separately, and the tacos are built when you eat."},{"title":"Fish safety","text":"Thaw the fillets overnight in the fridge in a covered box on the bottom shelf, never on the counter, and pour off the thaw water. Cook until the thickest part is opaque and flakes. Cooked fish keeps 2 days in the fridge; do not refreeze fish that was thawed raw. A carried lunch leaves the fridge with a frozen cool pack and is eaten within ~4 h; bin what is left. Wash board, knife and hands after raw fish."},{"title":"Air fryer & chiltepín","text":"The air-fryer times are estimates `[INFERENCE]` for a basket of 5 L or more and have not been tested on your model: look at the lower time and go by colour. Chiltepín is brutally hot: start with the smaller number of pods, taste a drop, then add. Toast the pods 15 s in a dry pan (open the window), crush them with the back of a spoon, wash your hands and keep them away from your eyes."}]},{"id":"Y","name":"Pork-ginger potstickers with ginger-soy pork & greens","knob":"porkXXL","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"hackSchwein":114,"porkXXL":114,"dumplingWrap":71,"chinakohl":114,"freshGinger":14,"springOnion":14,"broccoli":107,"spitzpaprika":60},"lock":{"bread":262.5,"oil":10,"veg":0,"solveKnob":false},"hue":260,"family":"pork","mealOf":{"oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":187.5},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Pork-ginger potstickers with ginger-soy pork, cabbage & broccoli** — Take one bag from the freezer: 71 g of wrappers folded round 114 g of Hackfleisch filling, about 9–10 dumplings (the weekly batch is in the notes). Heat 5 ml rapeseed oil in a lidded non-stick pan on medium-high, set the dumplings in frozen, flat side down and not touching, and brown the bottoms 2–3 min. Add 3 tbsp water, cover at once, turn to low and steam 6–8 min; lift the lid for the last minute so the water cooks off and the bottoms crisp again. Cut one open: the pork must be grey all through and steaming, no pink. While they steam, slice 114 g Schwein-Minutensteaks across the grain 5 mm thin and toss them with 1 tsp soy sauce and 3 g grated fresh ginger. In a second pan heat 5 ml rapeseed oil on max heat, sear the pork 90 s, add 60 g pointed red pepper in strips, 64 g shredded Chinakohl and 107 g TK broccoli straight from the freezer, and toss 3 min with a splash of water and the lid on. Dip: stir 1 tsp soy sauce, 2 tsp apple vinegar, a pinch of chili flakes, 3 g grated fresh ginger and 1 tsp water.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 5 slices (187,5 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with half an apple (70 g)."},"notes":[{"title":"Why this menu","text":"**Your 2 × 250 g of wrappers, 71 g a day: 497 g over 7 days, so both packs are gone in exactly one week.** The filling is the usual pork-and-cabbage one: Chinakohl salted and squeezed so it does not turn watery, then pork mince, fresh ginger, scallion, garlic and soy mixed by hand until sticky. Grounding: CJ Eats (1 lb pork, 1 lb napa, 3 scallions, 3 garlic cloves, 1 tbsp ginger, 1 tbsp soy, ~50 dumplings, 1 tbsp filling each, brown 2–3 min then steam covered) and The Kitchn (1 lb pork, ½ napa, scallions, 3 tbsp ginger, 70–80 dumplings, 6–8 min covered when cooked from frozen). **Mince alone cannot carry the protein:** Schweine-Hackfleisch is 18 g protein / 234 kcal per 100 g, so 114 g gives only 20,5 g, and the wrappers are ~9 % protein. The second pork is the sliced Minutensteak (23 g / 119 kcal) in the stir-fry, which brings the day to 162 g under the calorie ceiling; both packs are 800 g = 7 × 114 g, whole packs. **Eggs instead of the steak cost more:** an egg is ~€32 per kg of protein against ~€26 for the steak and carries 2,3 × the kcal per gram of protein, so 4 eggs a day force the toast down to 5 slices and the day comes to €5,29 against €5,16 (28 eggs a week, two 18-packs). **Wrapper facts:** €2,49 a pack is the price you gave; 285 kcal / 9 g protein / 2 g fiber per 100 g are `[INFERENCE]` until you send the panel from the pack. €5,16 a day, or about €4,45 if the wrappers count as already paid. Estimates from USDA/BLS reference values `[INFERENCE]`: calcium ~950 mg (just under 1000), iron ~17 mg, zinc ~18 mg, magnesium ~580 mg, vitamin C ~135 mg (most of it from the pointed red pepper), folate ~590 µg."},{"title":"Dumpling batch (once a week)","text":"Buy the mince on the batch day (it keeps 1 day) and fold everything in one go, about 1 h 15 min. **Filling for the whole 800 g pack:** chop 350 g Chinakohl fine, toss with 1 tbsp salt, leave 15 min and squeeze it dry in a clean tea towel (~250 g is left). Mix by hand in one direction until sticky, about 2 min: the cabbage, 800 g Schweine-Hackfleisch, 98 g scallions (the whole bunch) sliced thin, 56 g fresh ginger grated, 7 garlic cloves minced, 35 ml soy sauce, 1 tsp salt and 1 tsp black pepper. Fry one spoonful 1 min and taste: the wrapper is plain, so the filling has to be well seasoned. **Fold:** keep the wrappers under a damp tea towel (they dry and crack within minutes), put about 18 g (a heaped tablespoon) in the middle of each, wet the rim, fold and pleat shut; do not overfill. Lay them on parchment-lined trays without touching, freeze at least 1 h, then count them and bag them in 7 equal bags (about 10 dumplings, 71 g of wrappers each). **Count check:** the filling is ~1270 g, so it is 18 g a dumpling if the 2 packs give ~70 wrappers (7 g each). Weigh 10 wrappers: if a dumpling would need more than ~22 g, fold fewer per bag and pan-fry the surplus filling as a patty beside the stir-fry rather than overstuffing. **Lean pork:** slice the whole 800 g Minutensteak pack 5 mm thin and split it into 7 bags of 114 g; 2 in the fridge, 5 frozen flat, each moved to the fridge the evening before. The Chinakohl head keeps 2 weeks in the fridge; the rest of the 800 g (448 g) goes into the stir-fries. Kit: a lidded non-stick pan (28 cm) for the dumplings, a second pan or wok, 2 trays + parchment, freezer bags, a grater for the ginger. The air fryer is not used."},{"title":"Carry to uni","text":"Cook both pans in the morning, about 20 min from frozen. Pack the stir-fry first and the dumplings on top; the dip goes in a small jar. Thermos: preheat it 5 min with boiling water, fill it piping hot and eat within ~4 h while it is still above 60 °C. Otherwise cool everything within 1 h, pack it with a frozen cool pack, eat within ~4 h and reheat only until steaming (whether the uni has a microwave is unknown); the crisp bottoms will have gone soft."},{"title":"Food safety","text":"Raw pork mince: fridge, and fold or freeze it within 1 day of buying; the folded dumplings go into the freezer within 2 h. Never thaw the dumplings (they stick and tear): cook them from frozen until the pork is grey all through and steaming (core ≥ 70 °C, no pink; cut one open). Wash hands, board and tray after the raw pork before you touch the wrapper pack again."},{"title":"Label check","text":"Wrappers (Teigblätter / Gyoza-Teig): the ingredients should be wheat flour, water, salt (and some starch for dusting); the panel on the pack replaces my 285 kcal / 9 g protein / 2 g fiber, and the number of wrappers per pack replaces the 7 g each guessed above. Pork: take the MEINE METZGEREI Schweine-Hackfleisch 800 g (234 kcal / 18 g protein per 100 g), not Hackfleisch gemischt, and the plain natur Minutensteaks XXL. Soy sauce: the naturally brewed KIKKOMAN lists only water, soybeans, wheat, salt. Fresh ginger, scallions and Chinakohl are not in Aldi's online range, so their prices are `[INFERENCE]`; if there is no Chinakohl, Spitzkohl or Weißkohl takes the same grams."}]}];

const TREATS = {"intro":"Optional, not part of any menu. Each treat **takes the place of the day's 2 eggs** (it carries its own eggs), so only the milk, mascarpone, starch and butter are extra. The card shows how much bread to leave out for the menu selected in the Today tab, so the day stays at or under the calorie ceiling, and names the meal whose toast to cut.","treats":[{"id":"flan","name":"Sugar-free flan","short":"Flan","eggs":110,"items":[["eggs",110],["milk",140]],"recipe":"**Sugar-free flan, 1 portion** — Dissolve 2 sweetener tablets in 140 ml milk (vanilla milk if you keep a pod in the carton) and taste it before the eggs go in: slightly too sweet is right, because cold custard tastes less sweet. Whisk in 2 eggs (110 g) **gently**, foam makes a pocked top, pour through a sieve into a wide, shallow heat-proof bowl of ~300 ml (Ø ~10 cm, so the custard is ≤3,5 cm deep, the manual's limit for steamed food) and cover it tightly with foil. Put the steam insert in the pot and the bowl on it. Steam it either on a rice cycle (bowl on the insert while the rice cooks, ≤1 cup of rice, 26 min) or on its own in STEAM mode with 1–2 cups of water in the pot for 25 min (set with the +10MIN button). It is done when the edge has set and the middle wobbles like jelly; if it sloshes, STEAM 5 more min. Let it cool, then chill at least 4 h, so make it the evening before. Eat it with the coffee glaze: ½ tsp instant coffee, 1 tbsp hot water and 1 sweetener tablet stirred together.","notes":[{"title":"Numbers","text":"1 flan = 2 eggs + 140 ml milk: ~19 g protein, ~230 kcal, about €0,58, no added sugar (the milk's own lactose, ~6,7 g, stays). Compared with the 2 eggs it replaces, the extra is 140 ml milk: +64 kcal, +4,8 g protein, +€0,12. The 2 tablets are 2 of the ~29 a day the plan's cyclamate limit allows at your weight."},{"title":"Why it is cooked this way","text":"A hard boil makes a rubbery, pocked flan: a rice-cooker leche-flan post on cookingmummy.com ended up like an omelette, and its readers' fixes were to strain, avoid foam, cover tightly with foil, and cook low and slow. The Reishunger's STEAM mode lets you set the time, which is why it is used instead of the plain cook cycle. `[INFERENCE: the 25 min come from steamed-custard recipes and Reishunger's own steaming table, not from testing on your cooker.]` Before first use, test once, empty, that the bowl fits on the insert and the lid closes; if it doesn't, use two small ramekins with 1 egg and 70 ml milk each. Don't cover with paper towels or an extra lid: the manual says they can block the steam valve."},{"title":"No caramel, and vanilla","text":"Tablet sweeteners have no sugar to caramelise, and erythritol (not used in this plan) recrystallises as it cools; allulose, which does work, is not in Aldi's range. The coffee glaze gives the bitter note instead. For vanilla, split 1 vanilla pod (BACK FAMILY Bourbon-Vanilleschoten, 2 for €1,99) when you open a 1 l milk carton, scrape the seeds in and leave the pod in the carton: by the next day it is vanilla milk for the week's flans `[INFERENCE]`. Skip the Dr. Oetker vanilla extract and paste at Aldi: they are sugared."},{"title":"Storage and carry","text":"Covered in the fridge for up to 3 days `[INFERENCE]`. Carry it in its lidded bowl in the cool bag and eat it within ~4 h. One milk carton (1 l, shelf life ~7 days) covers 7 flans."}]},{"id":"cheesecake","name":"Cheesecake (rice cooker)","short":"Cheesecake","eggs":110,"items":[["eggs",27.5],["mascarpone",50],["milk",50],["starch",7.5],["butter",2.5]],"recipe":"**Cheesecake in the Reishunger, 1 bake = 2 portions, no whisk needed** — Take 100 g Mascarpone out of the fridge 30 min ahead and grease the pot lightly with 5 g butter (the manual says to). Dissolve 6 sweetener tablets in 100 ml warm milk (vanilla milk if you keep a pod in the carton) and let it cool a little. Put 15 g Speisestärke in a bowl and stir in the milk a little at a time with a fork until there are no lumps. Stir in // Day-type solver. Pure functions, no I/O, no dependencies.
// Runs identically in Bun (generator) and in the browser (index.html).
//
// Contract: every solved day hits `proteinTarget` (+/- rounding on the knob food),
// lands inside [kcalMin, kcalMax], and clears `fiberMin`. Bread, oil and veg are
// searched; the knob food is solved analytically for the protein target.

function macros(items, foods) {
  let kcal = 0, protein = 0, fiber = 0, cost = 0;
  for (const [key, g] of items) {
    const f = foods[key];
    if (!f) throw new Error(`unknown food: ${key}`);
    kcal += f.kcal * g / 100;
    protein += f.protein * g / 100;
    fiber += f.fiber * g / 100;
    cost += f.eurPerKg * g / 1000;
  }
  return { kcal: Math.round(kcal), protein: round1(protein), fiber: round1(fiber), cost: round2(cost) };
}

const round1 = x => Math.round(x * 10) / 10;
const round2 = x => Math.round(x * 100) / 100;
const round5 = x => Math.round(x / 5) * 5;
const round10 = x => Math.round(x / 10) * 10;

// Solve `knob` grams so the day hits the protein target.
function withKnob(items, knob, foods, target) {
  const others = items.filter(([k]) => k !== knob);
  const have = macros(others, foods).protein;
  const grams = Math.round((target - have) / foods[knob].protein * 100);
  return [...others, [knob, grams]];
}

/** Base items every day type shares (dairy, oats, peanut butter, eggs, fruit); `fixed` may override any, 0 drops it. */
function staples(dt, cons) {
  const s = cons.staples;
  const base = { eggs: s.eggsDefault, emmer: s.emmer, pb: s.pb, apple: s.apple };
  return [
    [dt.dairy, dt.dairyPerDay ?? s.dairyPerDay],
    ...Object.entries({ ...base, ...dt.fixed }).filter(([, g]) => g > 0),
  ];
}

/**
 * Solve one day type. Returns { id, name, items, macros, oil, veg, bread, dt } or null.
 * Preference among valid solutions: most bread, then most oil, then cheapest.
 */
function solveDay(dt, foods, cons) {
  const fixed = staples(dt, cons);
  // 35 g = half a 70 g roll: the finest granularity you can actually serve.
  const breadStep = cons.breadStep ?? 35;
  const breadMax = dt.breadMax ?? 490;
  const breadMin = dt.breadMin ?? 105;

  if (dt.lock) {
    // Fully specified day: no knob search (day B's tuna comes in whole 125 g tins).
    const items = [...fixed, [dt.bread, dt.lock.bread], ["oil", dt.lock.oil], ["veg", dt.lock.veg]];
    const solved = dt.lock.solveKnob === false ? items : withKnob(items, dt.knob, foods, cons.proteinTarget);
    return { id: dt.id, name: dt.name, items: solved, macros: macros(solved, foods), oil: dt.lock.oil, veg: dt.lock.veg, bread: dt.lock.bread, dt };
  }

  const oilMin = dt.oilMin ?? 10;
  const candidates = [];
  for (let oil = oilMin; oil <= 30; oil += 5) {
    for (let veg = cons.vegBase; veg <= cons.vegMax; veg += 50) {
      for (let bread = breadMax; bread >= breadMin; bread -= breadStep) {
        const items = withKnob([...fixed, [dt.bread, bread], ["oil", oil], ["veg", veg]], dt.knob, foods, cons.proteinTarget);
        const grams = items.find(([k]) => k === dt.knob)[1];
        if (grams <= 0) continue;
        const m = macros(items, foods);
        if (m.kcal > cons.kcalMax || m.kcal < cons.kcalMin || m.fiber < cons.fiberMin) continue;
        candidates.push({ id: dt.id, name: dt.name, items, macros: m, oil, veg, bread, dt });
      }
    }
  }
  candidates.sort((a, b) => b.bread - a.bread || b.oil - a.oil || a.macros.cost - b.macros.cost);
  return candidates[0] ?? null;
}

/** Split a solved day into breakfast / snack 1 / lunch / snack 2 / dinner. */
function splitMeals(day, foods, cons) {
  const g = Object.fromEntries(day.items);
  const dt = day.dt;
  const breadKeys = day.items.map(([k]) => k).filter(k => foods[k]?.bread);
  const primary = dt.bread;
  const meals = { Breakfast: [], "Snack 1": [], Lunch: [], "Snack 2": [], Dinner: [] };

  // No meat/fish main: lunch protein is bread (wheat), so pair it with complete protein in the
  // same meal — a third of the dairy and every egg go to lunch.
  const meatless = dt.meatless ?? !day.items.some(([k]) => foods[k]?.main);
  const dairy = g[dt.dairy], dairyLunch = meatless ? round10(dairy / 3) : 0;
  // `mealOf.dairy` moves the whole dairy portion to that meal (V: quark only at dinner).
  const dairyBreakfast = dt.mealOf?.dairy ? 0 : (dairy - dairyLunch) / 2;
  if (dairyBreakfast) meals.Breakfast.push([dt.dairy, dairyBreakfast]);
  if (g.emmer) meals.Breakfast.push(["emmer", g.emmer]);
  meals.Breakfast.push(["apple", cons.staples.apple / 2]);

  // Meatless days put eggs with the lunch bread; past 4 eggs, 2 move to the snack.
  // `mealOf.eggs` puts every egg in one meal (V: eggs and bacon for breakfast).
  const eggsPinned = dt.mealOf?.eggs;
  if (eggsPinned && g.eggs) meals[eggsPinned].push(["eggs", g.eggs]);
  const eggsSnack = eggsPinned ? 0 : meatless ? ((g.eggs ?? 0) > 220 ? 110 : 0) : Math.min(g.eggs ?? 0, 110);
  if (eggsSnack) meals["Snack 1"].push(["eggs", eggsSnack]);
  const eggsRest = eggsPinned ? 0 : (g.eggs ?? 0) - eggsSnack;
  if (meatless) {
    meals.Lunch.push([dt.dairy, dairyLunch]);
    if (eggsRest) meals.Lunch.push(["eggs", eggsRest]);
  }

  for (const [k, grams] of day.items) {
    if (foods[k]?.main) meals[dt.mealOf?.[k] ?? foods[k]?.meal ?? "Lunch"].push([k, grams]);
    // Fixed sides (broccoli, seeds, cheese) carry their own meal; a day type may move one (`mealOf`).
    else if (foods[k]?.meal) meals[dt.mealOf?.[k] ?? foods[k].meal].push([k, grams]);
  }
  for (const k of breadKeys) {
    if (k !== primary) { meals.Lunch.push([k, g[k]]); continue; }
    // A day type may place its bread explicitly (e.g. rice at lunch, so toast goes to breakfast/dinner).
    if (dt.breadMeals) {
      for (const [meal, grams] of Object.entries(dt.breadMeals)) meals[meal].push([k, grams]);
      continue;
    }
    const unit = foods[k].unit?.grams ?? 70;
    const lunch = Math.round(g[k] * 0.55 / unit) * unit;
    meals.Lunch.push([k, lunch]);
    meals.Dinner.push([k, g[k] - lunch]);
  }
  // Oil: ⅔ lunch / ⅓ dinner, unless the day type pins it to one meal (`mealOf.oil`).
  const oilLunch = dt.mealOf?.oil ? (dt.mealOf.oil === "Lunch" ? g.oil : 0) : round5(g.oil * 2 / 3), oilDinner = g.oil - oilLunch;
  if (oilLunch) meals.Lunch.push(["oil", oilLunch]);
  const vegLunch = round10(g.veg * cons.vegLunchShare);
  if (vegLunch) meals.Lunch.push(["veg", vegLunch]);

  const snack2Meal = dt.mealOf?.appleSnack ?? dt.mealOf?.mandarinSnack ?? "Snack 2";
  meals[snack2Meal].push(["apple", cons.staples.apple / 2]);

  meals.Dinner.unshift([dt.dairy, dairy - dairyLunch - dairyBreakfast]);
  meals.Dinner.push(["pb", g.pb]);
  if (eggsRest && !meatless) meals.Dinner.push(["eggs", eggsRest]);
  if (oilDinner) meals.Dinner.push(["oil", oilDinner]);
  if (g.veg - vegLunch) meals.Dinner.push(["veg", g.veg - vegLunch]);

  return Object.entries(meals).map(([meal, items]) => ({ meal, items, macros: macros(items, foods) }));
}

/** Veg mix €/kg from the same pack prices the shopping list charges, so €/day and the till agree. */
function vegEurPerKg(cons) {
  return Object.entries(cons.vegMix)
    .reduce((s, [k, g]) => s + g * cons.vegPacks[k].price / cons.vegPacks[k].edible, 0) / cons.vegBase * 1000;
}

/** Purchasable unit behind a use key: a food pack, a veg pack ("veg:onion") or a pantry item ("pantry:coffee"). */
function packOf(key, foods, cons) {
  if (key.startsWith("veg:")) return cons.vegPacks[key.slice(4)];
  if (key.startsWith("pantry:")) return cons.pantry[key.slice(7)];
  return foods[key].pack;
}


/** The one recipe text of a meal, or null when the day type gives none (e.g. a bare snack). */
function recipeOf(dt, meal) {
  return dt.meals?.[meal] ?? null;
}

/** One-time buys for a day type: `always` items (coffee, sweetener) plus seasonings its meals/notes text names. */
function spicesFor(dt, cons) {
  const text = JSON.stringify([dt.meals ?? {}, dt.notes ?? []]).toLowerCase();
  return Object.entries(cons.spices ?? {}).filter(([, s]) => s.always || s.keywords.some(k => text.includes(k)));
}

/** Daily use, in pack units (g / ml / tablets), of everything a solved day consumes. */
function dailyUse(day, foods, cons) {
  const use = {};
  for (const [k, g] of day.items) {
    if (k === "veg") continue;
    if (!foods[k].pack) throw new Error(`${k} is eaten on day ${day.id} but has no pack: it would be missing from the shopping list`);
    use[k] = (use[k] ?? 0) + g;
  }
  for (const [k, g] of vegBreakdown(day.veg, cons)) use["veg:" + k] = g;
  for (const [k, p] of Object.entries(cons.pantry)) use["pantry:" + k] = p.perDay;
  return use;
}

/** Days of use looked at past the horizon; shelf lives this long count as long-life. */
const LOOKAHEAD = 60;

/**
 * What `days` days of one solved day eat, per purchasable product: [{ key, pack, perDay, need }],
 * `perDay` and `need` in the pack's own unit (g or ml of edible food). Aisle order, dearest need first.
 * This is consumption only: how many packs to buy is the shopper's call after a pantry check.
 */
function needsFor(day, foods, cons, days = 7) {
  const order = cons.aisles.map(([a]) => a);
  const cost = x => x.need / x.pack.edible * x.pack.price;
  return Object.entries(dailyUse(day, foods, cons))
    .filter(([, perDay]) => perDay > 0)
    .map(([key, perDay]) => ({ key, pack: packOf(key, foods, cons), perDay, need: perDay * days }))
    .sort((a, b) => order.indexOf(a.pack.aisle) - order.indexOf(b.pack.aisle) || cost(b) - cost(a));
}

/**
 * Grams of `n` freshly bought packs still uneaten when the shelf life (`keeps` days) runs out, eating
 * `perDay` from day 1: freeze them on arrival, or buy them on a later top-up. 0 for long-life packs,
 * and for less than one day's use (the last mandarin is noise, not advice).
 */
function pastKeeps(pack, perDay, n) {
  if (pack.keeps >= LOOKAHEAD) return 0;
  const late = n * pack.edible - perDay * pack.keeps;
  return late >= perDay ? round10(late) : 0;
}

/**
 * Trip-by-trip shopping for a rotation of solved days (repeated to fill `horizon`).
 * Packs are bought just in time: a trip buys enough packs to cover cumulative use
 * through its last day, minus packs already bought. Leftovers carry forward, so
 * long-life packs (oil, coffee, peanut butter) only appear on the trip where they
 * run out, and the first trip is the pantry stock-up by construction.
 * `freezeG`: grams bought this trip (or carried into it) still uneaten when the
 * item's shelf life (`keeps` days) runs out — freeze them on arrival, or top up.
 * `freezerG` per trip: frozen-aisle packs plus everything to freeze, i.e. the
 * freezer space the trip needs on day 1.
 */
function shopPlan(rotation, foods, cons, every = 7, horizon = 28) {
  const uses = rotation.map(d => dailyUse(d, foods, cons));
  const keys = [...new Set(uses.flatMap(Object.keys))];
  const cum = {};
  for (const k of keys) {
    cum[k] = [0];
    // Extends past the horizon so shelf-life checks see the use after the last trip.
    for (let t = 0; t < horizon + LOOKAHEAD; t++) cum[k].push(cum[k][t] + (uses[t % uses.length][k] ?? 0));
  }
  const bought = (k, t) => Math.ceil(cum[k][Math.min(t, horizon)] / packOf(k, foods, cons).edible - 1e-9);
  const order = cons.aisles.map(([a]) => a);
  const trips = [];
  for (let s = 0; s < horizon; s += every) {
    const e = Math.min(s + every, horizon);
    const lines = [];
    for (const k of keys) {
      const p = packOf(k, foods, cons);
      const n = bought(k, e) - bought(k, s);
      if (n <= 0) continue;
      const stockEnd = bought(k, e) * p.edible;
      // Shelf lives past the look-ahead are long-life packs: never at risk.
      const atRisk = p.keeps < LOOKAHEAD
        ? stockEnd - Math.max(cum[k][s + p.keeps], bought(k, s) * p.edible)
        : 0;
      const perDay = cum[k][horizon] / horizon;
      lines.push({
        key: k, label: p.label, aisle: p.aisle, n, unit: p.price, line: round2(n * p.price),
        use: Math.round(cum[k][e] - cum[k][s]),
        carry: Math.round(stockEnd - cum[k][e]),
        // Less than one day's use past its shelf life is noise (the last mandarin), not advice.
        freezeG: atRisk >= perDay ? round10(atRisk) : 0,
        freeze: p.freeze, keeps: p.keeps,
      });
    }
    lines.sort((a, b) => order.indexOf(a.aisle) - order.indexOf(b.aisle) || b.line - a.line);
    const freezerG = lines.reduce((x, l) => x + (l.aisle === "frozen" ? l.n * packOf(l.key, foods, cons).edible : l.freeze ? l.freezeG : 0), 0);
    trips.push({ start: s, days: e - s, lines, freezerG, total: round2(lines.reduce((x, l) => x + l.line, 0)) });
  }
  const pantryDay = Object.values(cons.pantry).reduce((x, p) => x + p.perDay / p.edible * p.price, 0);
  const foodDay = rotation.reduce((x, d) => x + d.macros.cost, 0) / rotation.length;
  return {
    trips,
    till: round2(trips.reduce((x, t) => x + t.total, 0)),
    burnWeek: round2((foodDay + pantryDay) * 7),
  };
}

function vegBreakdown(veg, cons) {
  const scale = veg / cons.vegBase;
  return Object.entries(cons.vegMix).map(([k, v]) => [k, Math.round(v * scale)]);
}

/** Units label, e.g. "3 rolls" for 210g of Sonntagsbrötchen. */
function unitLabel(key, grams, foods) {
  const u = foods[key]?.unit;
  if (!u) return "";
  const n = grams / u.grams;
  const shown = Number.isInteger(n) ? n : round1(n);
  return `${shown} ${u.name}${n === 1 ? "" : "s"}`;
}

function solveAll(daytypes, foods, cons) {
  return daytypes.map(dt => {
    const day = solveDay(dt, foods, cons);
    if (!day) throw new Error(`no solution for day type ${dt.id} ${dt.name}`);
    return day;
  });
}

/**
 * A solved day with an optional treat (flan, cheesecake) eaten that day. `mode` "swap": the treat carries its own
 * eggs, so `treat.eggs` g of the day's eggs are dropped; "extra": nothing is dropped. The day's main bread is cut in
 * half-unit steps (half a slice) until kcal is back under `kcalMax`. Returns { cut, slices, macros, before, ok }.
 */
function withTreat(day, treat, mode, foods, cons) {
  const g = new Map(day.items);
  const add = (k, v) => g.set(k, (g.get(k) ?? 0) + v);
  if (mode === "swap") add("eggs", -Math.min(g.get("eggs") ?? 0, treat.eggs));
  for (const [k, v] of treat.items) add(k, v);
  const bread = day.dt.bread, unit = foods[bread].unit?.grams ?? 70, step = unit / 2;
  const list = () => [...g].filter(([, v]) => v > 1e-9);
  let cut = 0;
  while (macros(list(), foods).kcal > cons.kcalMax && (g.get(bread) ?? 0) >= step) { add(bread, -step); cut += step; }
  const m = macros(list(), foods);
  return { cut, slices: cut / unit, unit, macros: m, before: day.macros, ok: m.kcal <= cons.kcalMax && m.kcal >= cons.kcalMin && m.fiber >= cons.fiberMin };
}

/** "1½ slices", "½ wrap" or "none" for a bread cut in half-unit steps. */
function cutLabel(units, name) {
  if (!units) return "none";
  const whole = Math.floor(units + 1e-9), half = units - whole > 0.25;
  return `${whole || ""}${half ? "½" : ""} ${name}${units > 1 ? "s" : ""}`;
}

/**
 * Position of a solved day inside its constraints, as 0..1 fractions for CSS.
 * `ok` false means the day breaks a constraint — the UI paints it amber.
 */
function gauges(day, cons) {
  const m = day.macros;
  const span = cons.kcalMax - cons.kcalMin;
  const clamp = x => Math.max(0, Math.min(1, x));
  return {
    protein: { pct: clamp(m.protein / (cons.proteinTarget * 1.15)), ok: m.protein >= cons.proteinTarget - 1 },
    kcal: { pct: clamp((m.kcal - cons.kcalMin) / span), ok: m.kcal >= cons.kcalMin && m.kcal <= cons.kcalMax },
    fiber: { pct: clamp(m.fiber / (cons.fiberMin * 1.7)), floor: 1 / 1.7, ok: m.fiber >= cons.fiberMin },
  };
}

// UI for the food plan. Solves in the browser from the inlined data, so the
// single HTML file is the whole system: no server, no network, works offline.

const DAYS = solveAll(DAYTYPES, FOODS, CONS);
const BASE = DAYS.find(d => d.dt.baseline);
/**
 * App state. Memory is the source of truth, so the app works even where the browser gives the page no storage
 * at all: an HTML file opened from a phone's file manager can get an opaque origin, where localStorage throws.
 * Every change is mirrored to localStorage when it accepts writes and, unless the page is served over http(s),
 * to the URL fragment, which survives a reload and a tab the phone threw out of memory.
 * `saved` is false when the tab's address is the only copy.
 */
const store = (() => {
  const PRE = "fp:";
  const enc = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o))));
  const dec = s => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))));
  const write = (k, v) => { try { localStorage.setItem(PRE + k, JSON.stringify(v)); } catch {} };
  let mem = {}, saved = false;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(PRE)) try { mem[k.slice(PRE.length)] = JSON.parse(localStorage.getItem(k)); } catch {}
    }
    localStorage.setItem(PRE + "probe", "1");
    localStorage.removeItem(PRE + "probe");
    saved = true;
  } catch {}
  const inUrl = !saved || !/^https?:$/.test(location.protocol);
  // Nothing stored: take the state the address carries (a reloaded or restored tab of a local file).
  if (inUrl && !Object.keys(mem).length) {
    try {
      const o = dec(location.hash.slice(1));
      if (o && typeof o === "object" && !Array.isArray(o)) mem = o;
    } catch {}
    if (saved) for (const [k, v] of Object.entries(mem)) write(k, v);
  }
  return {
    saved,
    get: (k, fb) => mem[k] ?? fb,
    set(k, v) {
      mem[k] = v;
      if (saved) write(k, v);
      if (inUrl) try { history.replaceState(null, "", "#" + enc(mem)); } catch {}
    },
  };
})();

const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) if (kid) n.append(kid);
  return n;
};
const icon = id => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#i-" + id);
  s.append(u);
  return s;
};
const de = n => n.toFixed(1).replace(".", ",");
const eur = n => "€" + n.toFixed(2);
const qty = (k, g) => `${g}${FOODS[k].liquid ? "ml" : "g"}`;
const monthDelta = d => (d.macros.cost - BASE.macros.cost) * 30.44;
const signed = v => (v >= 0 ? "+" : "−") + "€" + Math.abs(v).toFixed(2);
const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const MEAL_ICON = { "Breakfast": "sun", "Snack 1": "apple", "Lunch": "pan", "Snack 2": "apple", "Dinner": "moon" };

const current = () => DAYS.find(d => d.id === store.get("day", BASE.id)) ?? BASE;

function picker(onchange) {
  const sel = el("select", { onchange: e => { store.set("day", e.target.value); onchange(); } });
  const cur = current().id;
  for (const d of DAYS) {
    const o = el("option", { value: d.id }, `${d.id} — ${d.name} · ${eur(d.macros.cost)}/day`);
    if (d.id === cur) o.selected = true;
    sel.append(o);
  }
  return sel;
}

function gauge(label, value, g, extra) {
  const track = el("div", { class: "track", style: `--pct:${g.pct}` + (g.floor ? `;--floor:${g.floor}` : "") },
    [el("i"), g.floor ? el("u") : null]);
  return el("div", { class: "stat" + (g.ok ? "" : " warn") },
    [el("b", {}, value), el("span", {}, label), track, extra]);
}

function stats(d) {
  const g = gauges(d, CONS);
  const wide = el("div", { class: "stat wide" }, [
    el("b", {}, `${eur(d.macros.cost)}/day · ${eur(d.macros.cost * 7)}/week`),
    el("span", {}, d.dt.baseline ? "baseline" : `${signed(monthDelta(d))}/month vs baseline`),
  ]);
  return el("div", { class: "stats" }, [
    gauge("protein", de(d.macros.protein) + "g", g.protein),
    gauge("kcal", String(d.macros.kcal), g.kcal),
    gauge("fiber", de(d.macros.fiber) + "g", g.fiber),
    wide,
  ]);
}

/** Pantry items (no grams in the plan) a single recipe calls for. */
const KITCHEN = [["lemon", "Lemon juice"], ["broth", "Chicken broth (homemade)"], ["water", "Water"]];
// Amount written directly before an ingredient word: "1 tbsp soy", "½ tsp LE GUSTO Kümmel", "a pinch of salt".
// Only a few filler words may sit between amount and ingredient, so a neighbour's amount never leaks in.
const AMOUNT = /(?:(\d+(?:[.,]\d+)?\s*[½¼¾]?|[½¼¾]|a|one|two)\s*(tsp|tbsp|ml|g)|(a (?:good |big )?(?:pinch|squeeze|splash|dab|few drops)))(?:\s+(?:of|each|ground|crushed|dried|plain|medium|black|apple|baking|le gusto|kikkoman))*\s+$/i;
// Countable items (tablets, leaves): a bare number right before the word is the count.
const COUNT = /(\d+|½|a|one|two)(?:\s+crushed)?\s+$/i;
const word = n => n.trim().replace(/^(a|one)$/i, "1").replace(/^two$/i, "2");
function amountsOf(text, keywords, countable) {
  const lo = text.toLowerCase(), found = [];
  for (const k of keywords) {
    for (let i = lo.indexOf(k); i >= 0; i = lo.indexOf(k, i + k.length)) {
      const before = text.slice(Math.max(0, i - 40), i);
      const m = before.match(AMOUNT);
      if (m) found.push(m[3] ? m[3].toLowerCase() : `${word(m[1])} ${m[2]}`);
      else if (countable) { const c = before.match(COUNT); if (c) found.push(`${word(c[1])}×`); }
    }
  }
  return [...new Set(found)];
}
function extrasFor(text) {
  const lo = text.toLowerCase();
  const items = [...Object.values(CONS.spices).map(s => [s.short, s.keywords]), ...KITCHEN.map(([k, l]) => [l, [k]])];
  return items.filter(([, ks]) => ks.some(k => lo.includes(k))).map(([name, ks]) => {
    const a = amountsOf(text, ks, /tablet|leaf/i.test(name));
    return a.length ? `${name} — ${a.join(" + ")}` : name;
  });
}

/** Recipe block inside a meal card: the recipe text and the extras it calls for. */
function howTo(text) {
  const extras = extrasFor(text);
  return el("div", { class: "how" }, [
    el("p", { html: inline(text) }),
    extras.length ? el("details", { class: "extras" }, [
      el("summary", {}, `Extras to have ready (${extras.length})`),
      el("ul", {}, extras.map(x => el("li", {}, x))),
    ]) : null,
  ]);
}

function viewToday(render) {
  const d = current();
  const out = [picker(render), stats(d)];
  for (const m of splitMeals(d, FOODS, CONS)) {
    if (!m.items.length) continue;
    const card = el("div", { class: "meal" }, [
      el("h3", {}, [icon(MEAL_ICON[m.meal]), el("span", {}, m.meal), el("em", {}, `${de(m.macros.protein)}g · ${m.macros.kcal} kcal`)]),
    ]);
    for (const [k, g] of m.items) {
      const u = unitLabel(k, g, FOODS);
      card.append(el("div", { class: "row" }, [
        el("i", { class: "ico", "aria-hidden": "true" }, FOOD_ICON[k] ?? "🍽️"),
        el("span", {}, [FOODS[k].label, u ? el("small", {}, u) : null]),
        el("b", {}, qty(k, g)),
      ]));
    }
    const text = recipeOf(d.dt, m.meal);
    if (text) card.append(howTo(text));
    out.push(card);
  }
  out.push(el("p", { class: "note", html: inline("**Coffee:** 2 mugs, 1 sweetener tablet each — bought as needed, see the Spices tab.") }));
  for (const n of d.dt.notes ?? []) {
    out.push(el("details", { class: "notecard" }, [el("summary", {}, n.title), el("p", { html: inline(n.text) })]));
  }
  return out;
}

const AISLE = Object.fromEntries(CONS.aisles);
const AISLE_ORDER = CONS.aisles.map(([a]) => a);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
/** 7 -> "7", 0.78 -> "0,8": a decimal only where it says something. */
const num = x => { const r = Math.round(x * 10) / 10; return Number.isInteger(r) ? String(r) : de(r); };

/** Grams, millilitres or the pantry item's own unit. */
const measure = (key, n) => key.startsWith("pantry:")
  ? `${Math.round(n)} ${CONS.pantry[key.slice(7)].unit}`
  : `${Math.round(n)}${FOODS[key]?.liquid ? "ml" : "g"}`;

/** Amount in the unit you count at home: whole eggs/slices/wraps where defined (rounded down), else g/ml. */
function amount(key, n) {
  const u = FOODS[key]?.unit;
  return u ? unitLabel(key, Math.floor(n / u.grams + 1e-9) * u.grams, FOODS) : measure(key, n);
}

/** "770g · 14 eggs · 0,8 packs": one need in grams, in the pieces you count, and in packs. */
function needLabel(key, need, pack) {
  const p = need / pack.edible;
  return [
    measure(key, need),
    unitLabel(key, need, FOODS),
    p < 0.05 ? "<0,1 packs" : `${num(p)} pack${num(p) === "1" ? "" : "s"}`,
  ].filter(Boolean).join(" · ");
}

/** What a list key buys: a food pack, a veg pack ("veg:onion"), a pantry item or a one-time seasoning ("spice:salt"). Null once the data drops it. */
function product(key) {
  if (key.startsWith("spice:")) {
    const s = CONS.spices[key.slice(6)];
    return s ? { label: s.label, price: s.price, aisle: "dry", once: true } : null;
  }
  if (key.startsWith("veg:")) return CONS.vegPacks[key.slice(4)] ?? null;
  if (key.startsWith("pantry:")) return CONS.pantry[key.slice(7)] ?? null;
  return FOODS[key]?.pack?.price ? FOODS[key].pack : null;
}

const VEG_ICON = { onion: "🧅", carrot: "🥕", leek: "🥬", tomatoes: "🥫", garlic: "🧄" };
const iconOf = key => key.startsWith("spice:") ? "🧂" : key.startsWith("veg:") ? VEG_ICON[key.slice(4)] ?? "🥕" : FOOD_ICON[key] ?? "🍽️";

/**
 * The shopping list: packs to buy per product key, set by hand after a pantry check.
 * One list for every menu and for the Spices tab; `got` holds the keys already in the trolley.
 */
const cart = {
  all: () => store.get("cart", {}),
  count: k => cart.all()[k] ?? 0,
  set(k, n) {
    const c = cart.all();
    if (n > 0) c[k] = n; else delete c[k];
    store.set("cart", c);
    if (n <= 0) store.set("got", store.get("got", []).filter(x => x !== k));
    paintBadge();
  },
  clear() { store.set("cart", {}); store.set("got", []); paintBadge(); },
  /** Lines to buy in aisle order, dearest first. Keys the data no longer has are skipped, so no total counts a hidden line. */
  lines: () => Object.entries(cart.all())
    .map(([key, n]) => ({ key, n, pack: product(key) }))
    .filter(x => x.pack && x.n > 0)
    .sort((a, b) => AISLE_ORDER.indexOf(a.pack.aisle) - AISLE_ORDER.indexOf(b.pack.aisle) || b.n * b.pack.price - a.n * a.pack.price),
  total: lines => lines.reduce((s, x) => s + x.n * x.pack.price, 0),
};

/** Products on the list, shown on the Shop tab so a tap in the Spices tab is visibly counted. */
const badge = el("b", { class: "badge" });
document.querySelector('nav button[data-view="shop"]').append(badge);
function paintBadge() { badge.textContent = cart.lines().length || ""; }

/** − n + control. `get`/`set` own the value; `changed` runs after a tap that moved it. */
function stepper(get, set, changed, min = 0, max = 99) {
  const out = el("output");
  const box = el("div", { class: "step" });
  const paint = () => { out.textContent = get(); box.classList.toggle("zero", !get()); };
  const tap = d => () => {
    const n = Math.max(min, Math.min(max, get() + d));
    if (n === get()) return;
    set(n);
    paint();
    changed?.(n);
  };
  box.append(
    el("button", { type: "button", "aria-label": "one less", onclick: tap(-1) }, "−"),
    out,
    el("button", { type: "button", "aria-label": "one more", onclick: tap(1) }, "+"),
  );
  paint();
  return box;
}
const cartStepper = (key, changed) => stepper(() => cart.count(key), n => cart.set(key, n), changed);

/** Shelf-life advice for `n` packs of a product the current menu eats `perDay` of; "" when all of it gets eaten in time. */
function keepsAdvice(key, pack, perDay, n) {
  const late = perDay ? pastKeeps(pack, perDay, n) : 0;
  if (!late) return "";
  return pack.freeze
    ? `Keeps ${pack.keeps} d: freeze ~${amount(key, late)} on arrival`
    : `Keeps ${pack.keeps} d: ~${amount(key, late)} won't be eaten in time, buy that part on a later top-up`;
}

/** Foods any menu or treat eats: the products worth offering in "add another product". */
const EATEN = new Set([...DAYS.flatMap(d => d.items), ...TREATS.treats.flatMap(t => t.items)].map(([k]) => k));

function viewShop(render) {
  const d = current();
  const days = Math.min(14, Math.max(1, Math.round(Number(store.get("days", 7))) || 7));
  const needs = needsFor(d, FOODS, CONS, days);
  const mode = store.get("shopMode", "pantry") === "store" ? "store" : "pantry";
  const seg = el("div", { class: "seg" }, [["pantry", "1 · Check pantry"], ["store", "2 · In store"]].map(([v, label]) =>
    el("button", { class: v === mode ? "on" : "", onclick: () => { store.set("shopMode", v); render(); } }, label)));
  // Say so when the list cannot outlive this tab, instead of losing it silently.
  const unsaved = store.saved ? null : el("p", { class: "note alert", html: inline(`**This copy cannot save to the phone** (opened as ${location.protocol}). Your menu and list live in this tab's address: come back to this tab instead of opening the file again.`) });
  return [unsaved, seg, ...(mode === "store" ? shopStore(render, needs) : shopPantry(render, d, days, needs))].filter(Boolean);
}

/** Step 1, at home: what the menu eats over `days` days, and a counter per product for the packs to buy. */
function shopPantry(render, d, days, needs) {
  const span = days === 7 ? "Week" : plural(days, "day");
  const sum = el("b"), sub = el("small");
  const go = el("button", { type: "button", onclick: () => { store.set("shopMode", "store"); render(); } }, "In store →");
  const paintSum = () => {
    const lines = cart.lines(), n = lines.reduce((s, x) => s + x.n, 0);
    sum.textContent = eur(cart.total(lines));
    sub.textContent = n ? `${plural(n, "pack")} · ${plural(lines.length, "product")}` : "Nothing yet: tap + on what you need";
    go.disabled = !n;
  };

  /** One product: what it is, what the menu eats of it (`need`, absent for off-menu lines, which show `hint`), and its counter. */
  const row = ({ key, pack, perDay, need }, hint) => {
    const buy = el("small", { class: "buy" }), warn = el("small", { class: "warn" });
    const node = el("div", { class: "item" });
    const paint = n => {
      warn.textContent = n ? keepsAdvice(key, pack, perDay, n) : "";
      if (!n) { buy.textContent = ""; return; }
      const over = need ? n * pack.edible - need : 0;
      const spare = over >= (FOODS[key]?.unit?.grams ?? 1) ? `, ${amount(key, over)} spare` : "";
      buy.textContent = eur(n * pack.price) + (!need ? ""
        : over > -1e-6 ? ` · covers ${days === 7 ? "the week" : `all ${days} days`}${spare}`
        : ` · covers ${num(n * pack.edible / perDay)} of ${days} days, the rest from your pantry`);
    };
    node.append(
      el("i", { class: "ico", "aria-hidden": "true" }, iconOf(key)),
      el("span", { class: "name" }, pack.label),
      el("small", { class: "need" }, [...(need ? [`${span}: `, el("b", {}, needLabel(key, need, pack))] : [hint]), ` · ${eur(pack.price)}/pack`]),
      cartStepper(key, n => { paint(n); paintSum(); }),
      buy, warn,
    );
    paint(cart.count(key));
    return node;
  };

  const list = el("div", { class: "meal" }, el("h3", {}, [
    el("span", {}, `Menu ${d.id} · ${days === 7 ? "one week" : plural(days, "day")}`),
    el("em", {}, `eats ${eur(d.macros.cost * days)}`),
  ]));
  let aisle = null;
  for (const x of needs) {
    if (x.pack.aisle !== aisle) { aisle = x.pack.aisle; list.append(el("div", { class: "aisle" }, AISLE[aisle])); }
    list.append(row(x));
  }

  // On the list but not eaten by this menu: another menu's products, treats, seasonings.
  const onMenu = new Set(needs.map(x => x.key));
  const others = cart.lines().filter(x => !onMenu.has(x.key));
  const extra = others.length ? el("div", { class: "meal" }, [
    el("h3", {}, el("span", {}, "Also on your list")),
    ...others.map(x => row(x, x.pack.once ? "One-time buy" : `Not eaten by menu ${d.id}`)),
  ]) : null;

  // Same product under two keys (yellow onions are a food and a veg-mix pack) is offered once.
  const seen = new Set([...needs, ...others].map(x => x.pack.label));
  const fresh = keys => keys.filter(k => !seen.has(product(k).label) && seen.add(product(k).label));
  const option = k => el("option", { value: k }, `${product(k).label} · ${eur(product(k).price)}`);
  const group = (label, keys) => keys.length ? el("optgroup", { label }, keys.map(option)) : null;
  const foodKeys = fresh([
    ...Object.keys(FOODS).filter(k => product(k) && (EATEN.has(k) || FOODS[k].grounding === "CONFIRMED")),
    ...Object.keys(CONS.vegPacks).map(k => "veg:" + k),
  ]).sort((a, b) => product(a).label.localeCompare(product(b).label));
  const adder = el("select", { class: "adder", "aria-label": "Add another product", onchange: e => { cart.set(e.target.value, 1); render(true); } }, [
    el("option", { value: "" }, "＋ Add another product…"),
    group("Other menus, treats, bread swaps", foodKeys),
    group("Seasonings, coffee & sweetener (one-time)", fresh(Object.keys(CONS.spices).map(k => "spice:" + k))),
  ]);

  paintSum();
  return [
    picker(render),
    el("p", { class: "note", html: inline(`**Pantry check.** Each row shows what ${days === 7 ? "**one week**" : `**${days} days**`} of menu ${d.id} eats: in grams, in pieces and in packs. Look at what you still have, then tap **+** for the packs to buy.`) }),
    el("div", { class: "days" }, [
      el("span", {}, ["Days to cover", el("small", {}, "7 = a week · 14 = two weeks · 2 = a weekend")]),
      stepper(() => days, n => store.set("days", n), () => render(true), 1, 14),
    ]),
    el("div", { class: "seg" }, [
      el("button", { type: "button", onclick: () => { for (const x of needs) cart.set(x.key, Math.ceil(x.need / x.pack.edible - 1e-9)); render(true); } },
        `Empty pantry: set ${days === 7 ? "a full week" : `all ${days} days`}`),
      el("button", { type: "button", onclick: () => { if (confirm("Clear the whole shopping list?")) { cart.clear(); render(true); } } }, "Clear the list"),
    ]),
    list, extra, adder,
    el("div", { class: "cartbar" }, [el("span", {}, [sum, sub]), go]),
    el("p", { class: "note", html: inline(`**One list for everything.** Switch the menu above and keep adding (two days of a weekend menu on top of five of another), and add a seasoning you ran out of from the **Spices** tab. Counters start at 0 and nothing is filled in for you. The shelf-life hints assume you eat this menu every day and count only what you buy now, so eat pantry stock first.`) }),
  ];
}

/** Step 2, in the shop: the list as a checklist in aisle order. */
function shopStore(render, needs) {
  const lines = cart.lines();
  if (!lines.length) {
    return [el("p", { class: "note", html: inline("**The list is empty.** Do the pantry check first and raise the counter of everything you need to buy.") })];
  }
  const perDay = new Map(needs.map(x => [x.key, x.perDay]));
  let got = store.get("got", []).filter(k => lines.some(x => x.key === k));
  const tally = el("em"), bar = el("div", { class: "bar" }, el("i")), left = el("p", { class: "note" });
  const card = el("div", { class: "meal" }, [el("h3", {}, [el("span", {}, `Shopping list · ${plural(lines.length, "line")}`), tally]), bar]);
  const refresh = () => {
    const open = lines.filter(x => !got.includes(x.key));
    bar.style.cssText = `--pct:${1 - open.length / lines.length}`;
    tally.textContent = `${lines.length - open.length}/${lines.length} · ${eur(cart.total(lines))}`;
    left.innerHTML = inline(open.length
      ? `**${eur(cart.total(open))}** still to buy · ${plural(open.length, "line")} left`
      : `**Done** — everything is in the trolley.`);
  };

  let aisle = null, freezer = 0;
  for (const { key, n, pack } of lines) {
    if (pack.aisle !== aisle) { aisle = pack.aisle; card.append(el("div", { class: "aisle" }, AISLE[aisle])); }
    const advice = keepsAdvice(key, pack, perDay.get(key), n);
    freezer += pack.aisle === "frozen" ? n * pack.edible : advice && pack.freeze ? pastKeeps(pack, perDay.get(key), n) : 0;
    const box = el("input", { type: "checkbox" });
    box.checked = got.includes(key);
    const pieces = FOODS[key]?.unit ? ` · ${amount(key, n * pack.edible)}` : "";
    const row = el("label", { class: "check" + (box.checked ? " done" : "") }, [
      box,
      el("span", {}, [`${n}× ${pack.label}`, el("small", {}, `${eur(pack.price)} each${pieces}${pack.once ? " · one-time buy" : ""}`), advice ? el("small", { class: "warn" }, advice) : null]),
      el("span", { class: "price" }, eur(n * pack.price)),
    ]);
    box.addEventListener("change", () => {
      got = box.checked ? [...got, key] : got.filter(v => v !== key);
      store.set("got", got);
      row.classList.toggle("done", box.checked);
      refresh();
    });
    card.append(row);
  }
  refresh();
  return [
    card, left,
    freezer > 0 ? el("p", { class: "note", html: inline(`**Freezer space on arrival: ~${de(freezer / 1000)} kg** (frozen packs + what to freeze).`) }) : null,
    el("p", { class: "note" }, "Aisle order follows a typical Aldi Süd layout; frozen last so it stays cold. To change a count, go back to the pantry check."),
    el("button", { class: "btn", onclick: () => { store.set("got", []); render(); } }, "Untick everything"),
    el("button", { class: "btn", onclick: () => { if (confirm("Trip done? This clears the shopping list.")) { cart.clear(); store.set("shopMode", "pantry"); render(); } } }, "Trip done: clear the list"),
  ];
}

function viewCompare() {
  const cols = [
    ["Day", d => `${d.id} ${d.name}`, d => d.id],
    ["kcal", d => String(d.macros.kcal), d => d.macros.kcal],
    ["Prot", d => de(d.macros.protein), d => d.macros.protein],
    ["Fib", d => de(d.macros.fiber), d => d.macros.fiber],
    ["€/day", d => eur(d.macros.cost), d => d.macros.cost],
    ["Δ€/mo", d => d.dt.baseline ? "—" : signed(monthDelta(d)), d => monthDelta(d)],
  ];
  const cur = current().id;
  let sort = store.get("sort", 4);
  if (!cols[sort]) sort = 4;
  const table = el("table");
  const draw = () => {
    table.replaceChildren();
    table.append(el("thead", {}, el("tr", {}, cols.map(([label], i) =>
      el("th", { onclick: () => { sort = i; store.set("sort", i); draw(); } }, label + (sort === i ? " ▾" : ""))))));
    const rows = [...DAYS].sort((a, b) => {
      const va = cols[sort][2](a), vb = cols[sort][2](b);
      return typeof va === "string" ? va.localeCompare(vb) : va - vb;
    });
    const body = el("tbody");
    for (const d of rows) {
      const tr = el("tr", { class: [d.dt.baseline && "base", d.id === cur && "cur"].filter(Boolean).join(" ") });
      cols.forEach(([, fmt], i) => {
        const td = el("td", i === 0 ? { class: "day", style: `--rowhue:${d.dt.hue}` } : {}, fmt(d));
        if (i === cols.length - 1 && !d.dt.baseline) td.className = monthDelta(d) < 0 ? "neg" : "pos";
        tr.append(td);
      });
      tr.addEventListener("click", () => { store.set("day", d.id); show("today"); });
      body.append(tr);
    }
    table.append(body);
  };
  draw();
  return [
    el("p", { class: "note", html: inline(`Tap a column to sort, tap a row to open that day (the one in bold is open now). Every day holds ~${de(CONS.proteinTarget)}g protein inside ${CONS.kcalMin}–${CONS.kcalMax} kcal with fiber ≥${CONS.fiberMin}g.`) }),
    table,
    el("p", { class: "foot", html: `Prices: real Aldi Süd permanent range, scraped ${CONS.scrapedOn}. Nutrition marked INFERENCE is standard reference, not an Aldi panel. Generated from <code>data/</code> by <code>gen.mjs</code>.` }),
  ];
}

function viewSpices() {
  const d = current();
  const render = () => show("spices");
  const list = spicesFor(d.dt, CONS);
  const total = list.reduce((s, [, x]) => s + x.price, 0);
  const card = el("div", { class: "meal" }, [
    el("h3", {}, [el("span", {}, `Spices for ${d.id}`), el("em", {}, `${eur(total)} once`)]),
    ...list.map(([k, s]) => {
      const users = DAYS.filter(o => spicesFor(o.dt, CONS).some(([j]) => j === k)).map(o => o.id).join(" ");
      return el("div", { class: "item" }, [
        el("span", { class: "name" }, s.label),
        el("small", { class: "need" }, [el("b", {}, eur(s.price)), ` · ${s.note} · keeps ${s.keeps >= 365 ? Math.round(s.keeps / 365) + " yr" : s.keeps + " d"} · menus ${users}`]),
        cartStepper("spice:" + k),
      ]);
    }),
  ]);
  return [
    picker(render),
    list.length ? card : el("p", { class: "note" }, "These recipes call for no seasonings."),
    el("p", { class: "note", html: inline("**One-time buys**, not in the €/day: each pack lasts months. Run out of one? Tap **+** and it goes on the list in the **Shop** tab. Fresh **lemon** isn't sold online; vinegar covers it.") }),
  ];
}

const TREAT_ICON = { flan: "🍮", cheesecake: "🍰" };

/** Optional treats. The bread to leave out is shown for the menu picked in the Today tab only. */
function viewTreats() {
  const render = () => show("treats");
  const treat = TREATS.treats.find(t => t.id === store.get("treat", "flan")) ?? TREATS.treats[0];
  const m = macros(treat.items, FOODS);
  const d = current();
  const [mode, hint, from = "dinner"] = TREATS.mode[d.id];
  const unit = FOODS[d.dt.bread].unit.name;
  const today = el("div", { class: "meal" }, [
    el("h3", {}, [el("span", {}, `Bread to leave out · ${d.id}`), el("em", {}, `${mode === "swap" ? "instead of" : "on top of"} ${hint} · bread from ${from}`)]),
    ...TREATS.treats.map(t => {
      const r = withTreat(d, t, mode, FOODS, CONS);
      return el("div", { class: "row" }, [
        el("i", { class: "ico", "aria-hidden": "true" }, TREAT_ICON[t.id] ?? "🍽️"),
        el("span", {}, [t.name, el("small", {}, `${r.macros.kcal} kcal · ${de(r.macros.protein)}g protein · ${de(r.macros.fiber)}g fiber · ${eur(r.macros.cost)}/day`)]),
        el("b", { style: r.ok ? "" : "color:var(--warn)" }, r.slices ? cutLabel(r.slices, unit) : "none"),
      ]);
    }),
  ]);
  const seg = el("div", { class: "seg" }, TREATS.treats.map(t =>
    el("button", { class: t.id === treat.id ? "on" : "", onclick: () => { store.set("treat", t.id); render(); } }, t.name)));
  const card = el("div", { class: "meal" }, [
    el("h3", {}, [el("span", {}, `${treat.short}, 1 portion`), el("em", {}, `${de(m.protein)}g · ${m.kcal} kcal · ${eur(m.cost)}`)]),
    ...treat.items.map(([k, g]) => el("div", { class: "row" }, [
      el("i", { class: "ico", "aria-hidden": "true" }, FOOD_ICON[k] ?? "🍽️"),
      el("span", {}, FOODS[k].label),
      el("b", {}, qty(k, g)),
    ])),
    howTo(treat.recipe),
  ]);
  return [
    el("p", { class: "note", html: inline(TREATS.intro) }),
    today,
    seg,
    card,
    ...treat.notes.map(n => el("details", { class: "notecard" }, [el("summary", {}, n.title), el("p", { html: inline(n.text) })])),
  ];
}

const VIEWS = { today: viewToday, shop: viewShop, spices: viewSpices, treats: viewTreats, compare: viewCompare };
const app = document.getElementById("app");
const crumb = document.getElementById("crumb");

/** Draw a view. `keep` holds the scroll position, for redraws caused by a control further down the page. */
function show(view, keep = false) {
  store.set("view", view);
  const d = current();
  document.documentElement.style.setProperty("--hue", d.dt.hue);
  crumb.textContent = `${d.id} · ${d.name}`;
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.view === view);
  app.replaceChildren(...VIEWS[view](k => show(view, k === true)));
  if (!keep) window.scrollTo(0, 0);
}
for (const b of document.querySelectorAll("nav button")) b.addEventListener("click", () => show(b.dataset.view));
paintBadge();
show(store.get("view", "today"));

// Served over http(s): keep an offline copy, and offer the new version once a deploy has replaced the old one.
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  const updating = !!navigator.serviceWorker.controller;   // false on the very first visit: nothing to replace
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!updating || document.querySelector(".update")) return;
    document.querySelector("header").append(
      el("button", { class: "update", onclick: () => location.reload() }, "New version downloaded · tap to load it"));
  });
}

</script>
</body>
</html>
