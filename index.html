<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Food plan</title>
<style>
:root {
  --bg: #f6f7f9;
  --card: #fff;
  --card2: #f1f4f6;
  --line: #dde2e8;
  --fg: #16191d;
  --dim: #5f6b78;
  --track: #e3e7ec;
  --good: #2f8a4c;
  --warn: #9a6a12;
  --pad: 13px;
  --hue: 145;
  --accent: hsl(var(--hue) 42% 38%);
  --accent-dim: hsl(var(--hue) 45% 90%);
  --tabh: 58px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
svg[hidden] { display: none; }
body {
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom));
}

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 10px var(--pad) 11px;
}
header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--accent);
}
h1 {
  font-size: 11px; margin: 0 0 8px; color: var(--dim);
  font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  display: flex; justify-content: space-between; gap: 14px;
}
h1 span { flex: none; }
h1 em { font-style: normal; color: var(--accent); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.update {
  display: block; width: 100%; padding: 9px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  color: #fff; background: var(--accent); border: none; border-radius: 10px;
}
main { padding: var(--pad); max-width: 900px; margin: 0 auto; }

/* ---------- bottom tabs ---------- */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; height: calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
nav button {
  position: relative;
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  background: none; color: var(--dim); border: none; cursor: pointer;
  transition: color .12s;
}
nav button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button.on { color: var(--accent); }
nav button.on svg { stroke-width: 2.2; }
.badge {
  position: absolute; top: 5px; left: calc(50% + 5px); min-width: 17px; height: 17px; padding: 0 5px;
  color: #fff; background: var(--accent); border-radius: 9px;
  font-size: 10.5px; line-height: 17px; letter-spacing: 0; text-align: center;
}
.badge:empty { display: none; }

select, .btn {
  width: 100%; padding: 12px; font: inherit; font-weight: 650;
  color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 11px;
  transition: border-color .12s;
}
select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { cursor: pointer; color: var(--dim); font-size: 14px; }
.btn + .btn { margin-top: 8px; }
select.adder { font-size: 14px; font-weight: 500; color: var(--dim); }

/* ---------- stat gauges ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 11px 0; }
.stat {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 11px; padding: 8px 9px 9px;
}
.stat b { display: block; font-size: 18px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.stat .track {
  position: relative; height: 4px; margin-top: 7px;
  background: var(--track); border-radius: 3px; overflow: hidden;
}
.stat .track i {
  position: absolute; inset: 0 auto 0 0; width: calc(var(--pct) * 100%);
  background: var(--good); border-radius: 3px;
  transition: width .2s ease-out;
}
.stat.warn b { color: var(--warn); }
.stat.warn .track i { background: var(--warn); }
.stat .track u {
  position: absolute; top: -2px; bottom: -2px; left: calc(var(--floor) * 100%);
  width: 2px; background: var(--fg); opacity: .45; text-decoration: none;
}
.stat.wide { grid-column: span 3; display: flex; align-items: baseline; gap: 8px; }
.stat.wide b { font-size: 15px; }

/* ---------- meal cards ---------- */
.meal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 9px 0; overflow: hidden; }
.meal > h3 {
  margin: 0; padding: 8px 11px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  background: var(--card2); color: var(--dim);
  display: flex; align-items: center; gap: 8px;
}
.meal > h3 em { font-style: normal; color: var(--fg); letter-spacing: 0; text-transform: none; font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.meal > h3 svg { width: 15px; height: 15px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.row {
  display: flex; align-items: baseline; gap: 10px;
  padding: 7px 11px; border-top: 1px solid var(--line); font-size: 15px;
}
.ico {
  flex: 0 0 30px; height: 30px; align-self: center; display: grid; place-items: center;
  font-style: normal; font-size: 18px; line-height: 1; border-radius: 9px; background: var(--accent-dim);
}
.row:has(.ico) { align-items: center; }
.extras { margin: 2px 0 8px; border: 1px dashed var(--line); border-radius: 9px; padding: 0 10px; background: var(--card); }
.extras summary { cursor: pointer; padding: 7px 0; font-size: 13px; font-weight: 600; color: var(--accent); }
.extras ul { margin: 0 0 8px; padding-left: 18px; font-size: 13.5px; columns: 2; column-gap: 16px; }
.extras li { break-inside: avoid; margin: 2px 0; }
.row:first-of-type { border-top: none; }
.row span { flex: 1; min-width: 0; }
.row b { width: 72px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row small, label.check small, .item small { color: var(--dim); display: block; font-size: 12px; }
.note { color: var(--dim); font-size: 13.5px; margin: 10px 0; }
.note strong { color: var(--fg); }
.alert {
  padding: 9px 11px; color: var(--fg); border: 1px solid var(--warn); border-radius: 11px;
  background: color-mix(in srgb, var(--warn) 9%, var(--card));
}
.how { border-top: 1px solid var(--line); padding: 2px 11px 4px; background: var(--card2); }
.how p { margin: 8px 0; font-size: 14px; line-height: 1.45; }
.notecard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; padding: 0 11px; }
.notecard summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 14px; }
.notecard p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.45; }

/* ---------- shop ---------- */
.bar { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; width: calc(var(--pct) * 100%); background: var(--accent); transition: width .18s ease-out; }
label.check {
  display: flex; gap: 11px; align-items: center; padding: 10px 11px;
  border-top: 1px solid var(--line); cursor: pointer; font-size: 15px;
  transition: background .12s;
}
label.check:first-of-type { border-top: none; }
label.check:active { background: var(--card2); }
label.check input { width: 21px; height: 21px; accent-color: var(--accent); flex: none; }
label.check span { flex: 1; min-width: 0; }
label.check.done > span { text-decoration: line-through; color: var(--dim); }
label.check .price { flex: none; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
label.check small.warn { color: var(--warn); }
.aisle {
  padding: 9px 11px 3px; border-top: 1px solid var(--line);
  color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
}

/* product rows with a counter: Shop pantry check, Spices */
.item {
  display: grid; grid-template-columns: 1fr auto;
  grid-template-areas: "name step" "need need" "buy buy" "warn warn";
  column-gap: 10px; align-items: center; padding: 8px 11px 9px;
  border-top: 1px solid var(--line); transition: background .12s;
}
.item:has(.ico) {
  grid-template-columns: 30px 1fr auto;
  grid-template-areas: "ico name step" "ico need need" ". buy buy" ". warn warn";
}
.meal > h3 + .item { border-top: none; }
.item:has(.step:not(.zero)) { background: color-mix(in srgb, var(--accent-dim) 45%, var(--card)); }
.item .ico { grid-area: ico; align-self: start; margin-top: 3px; }
.item .name { grid-area: name; font-size: 15px; }
.item .need { grid-area: need; margin-top: 3px; font-size: 12.5px; }
.item .need b { color: var(--fg); font-weight: 600; }
.item .step { grid-area: step; }
.item .buy { grid-area: buy; margin-top: 3px; color: var(--accent); font-weight: 600; }
.item .warn { grid-area: warn; color: var(--warn); }
.item small:empty { display: none; }

.step {
  display: flex; align-items: center; background: var(--card); border: 1px solid var(--accent); border-radius: 999px;
  user-select: none; -webkit-user-select: none;
}
.step button {
  width: 36px; height: 36px; padding: 0; font: inherit; font-size: 21px; line-height: 1;
  color: var(--accent); background: none; border: none; border-radius: 50%; cursor: pointer;
  touch-action: manipulation; /* rapid taps count up instead of zooming the page */
}
.step button:active { background: var(--accent-dim); }
.step output { min-width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.step.zero { border-color: var(--line); }
.step.zero output { color: var(--dim); font-weight: 500; }
.step.zero button:first-child { opacity: .3; }

.days {
  display: flex; align-items: center; gap: 10px; margin: 10px 0; padding: 8px 11px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 600;
}
.days span { flex: 1; min-width: 0; }
.days small { display: block; color: var(--dim); font-size: 12px; font-weight: 400; }

/* running total of the list; floats above the tab bar while the list is longer than the screen */
.cartbar {
  position: sticky; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 8px); z-index: 5;
  display: flex; align-items: center; gap: 10px; margin: 10px 0; padding: 8px 8px 8px 14px;
  color: #fff; background: var(--accent); border-radius: 14px; box-shadow: 0 6px 18px rgb(0 0 0 / .2);
}
.cartbar span { flex: 1; min-width: 0; }
.cartbar b { display: block; font-size: 18px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.cartbar small { display: block; font-size: 12px; opacity: .85; }
.cartbar button {
  flex: none; padding: 10px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  color: var(--accent); background: #fff; border: none; border-radius: 10px;
}
.cartbar button:disabled { opacity: .5; cursor: default; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.seg button {
  flex: 1 1 auto; padding: 9px 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  color: var(--dim); background: var(--card); border: 1px solid var(--line); border-radius: 10px;
}
.seg button.on { color: var(--fg); background: var(--accent-dim); border-color: var(--accent); }

/* ---------- compare ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 5px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; white-space: nowrap; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:active { background: var(--card2); }
tr.base { background: var(--accent-dim); }
tr.cur td.day { font-weight: 700; }
td:not(.day) { white-space: nowrap; }
td.day { display: flex; align-items: baseline; gap: 7px; }
td.day::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: hsl(var(--rowhue) 50% 55%);
}
td.neg { color: var(--good); }
td.pos { color: var(--warn); }
.foot { color: var(--dim); font-size: 11.5px; margin: 14px 0 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media print {
  :root { --bg: #fff; --card: #fff; --card2: #fff; --line: #bbb; --fg: #000; --dim: #444; --tabh: 0px; }
  header::after, nav, .notecard, .seg, .foot, select, .stats, .btn, .days, .cartbar, .step button, .alert, .update { display: none; }
  .step { border: none; }
  body { font-size: 11pt; padding: 0; }
  header { position: static; backdrop-filter: none; }
  .meal { break-inside: avoid; }
  label.check input { -webkit-appearance: none; appearance: none; border: 1px solid #000; border-radius: 3px; }
}

</style>
</head>

const DAYTYPES = [{"id":"C","name":"Roast chicken","knob":"brathaehnchen","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"brathaehnchen":110,"eggs":110,"broccoli":200,"sunflower":35,"gouda":40},"lock":{"bread":300,"oil":5,"veg":0,"solveKnob":false},"hue":145,"family":"poultry","meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top.","Lunch":"**Soy-ginger glazed chicken & charred broccoli** — Heat 5 ml rapeseed oil until smoking and **char** the thawed 200 g TK broccoli 4 min, unstirred for the first 2 min. Add 110 g roast chicken, 2 tbsp broth, 1 tsp soy sauce and a pinch each of ground ginger and chili flakes; lid on 2 min until steaming hot and glossy. Squeeze over lemon juice and mop the pan with 4 slices (150 g) toasted Vollkorn-Sandwichtoast.","Dinner":"**Gouda-mustard melts with fried eggs & cocoa-peanut quark** — Spread 4 slices (150 g) Vollkorn-Sandwichtoast with mustard, top with 40 g grated Gouda jung and bake at 200 °C for 6 min. Fry 2 eggs (110 g) in a dry non-stick pan and lay one on each of two melts. Dessert: Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Stir in 4 g baking cocoa, and finish with 1 apple (70 g)."},"notes":[{"title":"Why this menu","text":"**One TK Brathähnchen (1,2 kg, 65% edible assumed ≈ 780 g) is exactly 7 × 110 g: one bird a week, no waste.** Broccoli, sunflower seeds and Gouda close the micronutrient gaps. This is the cost baseline of the plan. **Weigh the stripped meat once** to confirm the 65% yield; if it is under 770 g, make the last portion smaller."},{"title":"Roast & carve","text":"Bird thaws ~24 h in the fridge (bottom shelf, plate, in its bag); don't rinse it. Pat dry, rub salt, pepper, paprika. **200 °C fan, ~75 min**, breast up. Done at **75 °C** in the thickest thigh (no bone contact), or when juices run clear and the leg wobbles loose. Rest 15 min, strip warm by hand, tare a box, weigh **7 × 110 g**, cool spread out, fridge within 1 h: Sunday's portion is eaten fresh, Mon–Wed stay in the fridge (≤3 days), Thu–Sat are frozen flat in labelled bags."},{"title":"Bones → broth","text":"Carcass, wing tips, skin and tray jelly into a pot, ~1 l water, **bay leaf**, 10 peppercorns, ¼ tsp **ground ginger**, splash of **soy**; barely simmer 2–3 h, strain, cool fast, lift off the fat: ~700 ml. The lunch only needs 2 tbsp a day for reheating the chicken; freeze the rest in 150 ml bags for the soup menu D or next week's reheating."},{"title":"Weekly schedule","text":"**Sat**: bird freezer → fridge. **Sun**: roast, carve, broth in the oven. **Wed/Thu/Fri nights**: move tomorrow's frozen chicken portion to the fridge. **Every night**: next day's 200 g TK broccoli into a covered box in the fridge (never thaw it on the counter). Eggs: 2 a day, fried raw at dinner = 14 a week."},{"title":"Carry to uni","text":"Char the broccoli the night before and cool it 10 min; pack cold chicken, broccoli and the 4 toast slices in separate boxes with a cool pack, eat within ~4 h. Anything not eaten by evening goes in the bin."},{"title":"Seasonings","text":"Seasonings and broth add ~15–30 kcal/day, not in the totals."}],"baseline":true,"mealOf":{"eggs":"Dinner","appleSnack":"Dinner"},"breadMeals":{"Lunch":150,"Dinner":150}},{"id":"D","name":"Chicken-broth soup","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"brathaehnchen":110,"eggs":110,"broccoli":200,"sunflower":35,"gouda":40},"mealOf":{"gouda":"Lunch","eggs":"Dinner","appleSnack":"Dinner"},"lock":{"bread":300,"oil":10,"veg":0,"solveKnob":false},"hue":15,"family":"soup","meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top.","Lunch":"**Chicken-broccoli cream soup with Gouda toasts** — Off the heat, bloom ½ tsp thyme and ½ tsp ground ginger in 5 ml rapeseed oil 20 s, then add 300 ml chicken broth, 1 tsp soy sauce, 1 bay leaf and 200 g TK broccoli. Simmer 8 min, remove the bay leaf and blend two thirds of the soup smooth with a stick blender (or mash it hard with a potato masher), leaving the rest in florets. Add 110 g roast chicken torn into chunks and simmer 3 min until steaming. Off the heat stir in 40 g grated Gouda jung, 1 tsp apple vinegar, pepper and a pinch of nutmeg. Toast 4 slices (150 g) Vollkorn-Sandwichtoast and dunk.","Dinner":"**Cinnamon Arme Ritter with peanut drizzle & apple** — Whisk 2 eggs (110 g) with 3 tbsp water, cinnamon and a crushed sweetener tablet; soak 4 slices (150 g) Vollkorn-Sandwichtoast 20 s a side. Fry in 5 ml rapeseed oil over medium heat 2–3 min a side until golden and the egg is fully set. Whip 250 g Magerquark with a sweetener tablet and cinnamon and spoon it over, thin 25 g Erdnusscreme with 1 tbsp hot water, drizzle on top, and eat half an apple (70 g) on the side."},"notes":[{"title":"Why this menu","text":"**Hot chicken soup, no tomato.** The soup is chicken broth, 200 g TK broccoli, 110 g roast chicken and 40 g Gouda; toast carries the calories. One TK Brathähnchen a week (≈ 780 g edible, 7 × 110 g) gives the meat and the carcass broth. No tomato product. The broth is lighter than a tomato base, so ginger, thyme, soy and a splash of vinegar do the seasoning."},{"title":"Roast, broth & portions","text":"Sun 10:30: roast the thawed 1,2 kg chicken at 200 °C fan ~75 min to 75 °C in the thigh, rest 15 min, strip into 7 × 110 g. Fridge Sun–Wed (Sunday's is eaten fresh), freeze Thu–Sat flat. **Broth for the week, ~2,1 l:** carcass, wing tips, skin and tray jelly in a big pot with 2,5 l cold water, 1 bay leaf, 10 peppercorns, ½ tsp ground ginger and 1 tsp soy; barely simmer, lid half on, 3 h; strain, chill, lift the fat. Fridge 3 × 300 ml (Sun–Tue); freeze 4 × 300 ml flat in bags and move one to the fridge each evening from Tue."},{"title":"Soup rules & food safety","text":"Bloom dried spices 20 s in the oil off the heat. Broccoli straight from frozen: 5 min keeps bite, 8 min is blendable. Reheat each broth portion to a rolling boil, add the chicken last and simmer 3 min until steaming throughout. Salt only at the end (the soy is salty), always finish with acid. Cool leftover broth within 2 h, fridge ≤3 days."},{"title":"Kit","text":"Stick blender (Pürierstab, ~€10) blends straight in the pot, head fully submerged. No blender: simmer the broccoli 3–4 min longer and mash hard with a potato masher; the Gouda helps it turn creamy. Also big pot, grater, 4 freezer bags, probe thermometer (~€8) for the 75 °C check. For a uni day, pour the boiling soup into a preheated thermos and eat within ~4 h."},{"title":"Label check","text":"Soy sauce: plain soy/wheat/salt/water only, no 'Würzsauce' blends. Mustard-free recipe; check the Thymian and Muskat jars for pure spice lists. Seasonings and broth add ~15–30 kcal/day, not in the totals."}],"breadMeals":{"Lunch":150,"Dinner":150},"knob":"brathaehnchen"},{"id":"E","name":"Pork stir-fry with rice","knob":"porkXXL","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":110,"broccoli":200,"sunflower":35,"gouda":30,"porkXXL":100,"rice":120},"lock":{"bread":225,"oil":5,"veg":0,"solveKnob":false},"hue":30,"family":"pork","mealOf":{"eggs":"Lunch","mandarinSnack":"Dinner"},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then scatter them over with 1 mandarin (70 g) in segments. Toast 2 slices Vollkorn-Sandwichtoast (75 g) and drag them through the **quark**.","Lunch":"**Ginger-soy pork & broccoli rice with hard-boiled eggs** — Slice 100 g pork Minutensteaks thin across the grain, velvet 10 min in 1 tsp soy sauce + 1 tbsp water + ½ tsp ground ginger. Heat 5 ml rapeseed oil in a hot pan, sear the pork 90 s on max heat, then add 200 g TK broccoli (thawed) and toss 2 min. Toss in 120 g parboiled rice (dry weight, cooked batch) with 1 tbsp soy sauce and black pepper until steaming throughout. Pack 2 hard-boiled eggs (110 g) from the Sunday batch alongside in the lunch box (peeled or in the shell; eat alongside the rice bowl).","Dinner":"**Peanut-cinnamon quark with cheese toast & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 4 slices (150 g) Vollkorn-Sandwichtoast; grate 30 g Gouda jung over two of them and grill until bubbling and golden. Eat the cheese toast and the sweet quark side by side, and finish with 1 apple (70 g) for dessert."},"notes":[{"title":"Why this menu","text":"**Cheapest complete menu so far (€4,52/day).** Pork Minutensteaks from the 800 g XXL pack cost €5,86/kg, which is €25,5 per kg of protein, against €43 for chicken breast. Parboiled rice at €1,39/kg is the cheapest calorie source in the plan. Rice replaces toast at lunch, so the toast moves to breakfast and dinner. Broccoli, sunflower seeds and Gouda close the micronutrient gaps as in the other menus. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~17 mg, zinc ~17 mg, calcium ~1060 mg, magnesium ~550 mg, vitamin C ~125 mg, folate ~480 µg. The rice fiber value is a reference value; its Aldi panel lists none."},{"title":"Weekly schedule","text":"Pork: buy the 800 g XXL pack on Saturday = 8 × 100 g. Cook 1 that day, keep 1 in the fridge for Sunday, and the same day freeze 6 flat in thin bags (the spare rolls into next week). Move each portion to the fridge ~24 h before its cook. Pan cooks: Sun eve (Mon cold), Tue morning (thermos), Tue eve (Wed cold), Thu morning (thermos), Thu eve (Fri cold), Sat + Sun at lunch. Rice, 840 g dry/week: Sun eve 360 g dry (Mon–Wed), Wed eve 240 g dry (Thu–Fri), Fri eve 240 g dry (Sat–Sun); weigh each cooked batch and split it evenly into boxes. Eggs: boil 8 on Sunday (Sun–Wed) and 6 on Wednesday (Thu–Sat) = 14 per week, kept in the shell in the fridge."},{"title":"Rice & carry safety","text":"Bacillus cereus spores survive boiling; if cooked rice sits warm they germinate and make a heat-stable toxin that reheating will not destroy. So: drain, spread thin on a tray, boxed in the fridge within 1 h, eat within 3 days, reheat only once and only until steaming throughout. Pork: thin slices cook through in ~90 s on max heat — no pink juices. Cold carry (Mon/Wed/Fri): cooked the evening before, chilled within 1 h, packed straight from the fridge with a frozen cool pack, eaten within ~4 h; bin leftovers. Thermos (Tue/Thu): preheat 5 min with boiling water, fill to the brim piping hot, eat within ~4 h while above 60 °C; if it is only lukewarm, don't eat it."},{"title":"Kit","text":"Wide-mouth stainless food thermos, 0.9–1 L (a full lunch is ~650 g). Leak-proof ~1 L lunch box for the cold days. Insulated lunch bag + 2 freezer cool packs, rotated so one is always frozen. Kitchen scale (rice weighed dry, pork raw). Baking tray for cooling rice, 3 lidded rice boxes, flat freezer bags. A large carbon-steel or nonstick pan (28 cm) — get it smoking hot before the 5 ml oil goes in; heat, not more oil, gives the char."},{"title":"Label check","text":"KIKKOMAN: the naturally brewed bottle lists only water, soybeans, wheat, salt — skip teriyaki or 'flavoured' variants. Minutensteaks: take the plain 'natur' XXL pack; marinated or 'gewürzt' versions usually carry allium seasoning. Paprika, Pfeffer bunt, ground ginger: pure spice lists only, no 'Gewürzzubereitung' with flavour enhancers or allium powders. Horseradish and mustard jars: scan for allium and added sugar. Erdnusscreme: ideally just peanuts (+ salt). BON-RI rice: plain parboiled, not a seasoned mix. Vollkorn-Sandwichtoast: wholegrain flour listed first."}],"breadMeals":{"Breakfast":75,"Dinner":150}},{"id":"G","name":"Aguachile negro (Sat + Sun)","knob":"shrimp","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":165,"broccoli":100,"sunflower":35,"gouda":30,"shrimp":125,"tortillaChips":45,"cucumber":150,"redOnion":40,"lime":40,"cilantro":5},"mealOf":{"broccoli":"Dinner","oil":"Dinner"},"breadMeals":{"Breakfast":112.5,"Dinner":150},"lock":{"bread":262.5,"oil":5,"veg":0,"solveKnob":false},"hue":160,"family":"seafood","meals":{"Breakfast":"**Cinnamon-Mandarin Emmer Quark Bowl** — Stir Magerquark 250 g with a splash of water, a pinch of cinnamon and a crushed sweetener tablet until glossy. Fold in Emmerflocken 50 g and let it sit 5 min to soften. Dry-toast sunflower seeds 35 g in the pan 2–3 min until fragrant and scatter them over with 1 mandarin (70 g) in segments. Toast 3 slices Vollkorn-Sandwichtoast (112,5 g) and eat alongside, dragging them through the quark.","Snack 1":"**Chili-Lime Eggs** — 2 boiled eggs (110 g) from the Saturday-morning batch (9 min, ice bath), halved and seasoned with salt, chili flakes and a few drops of lime, street-cart style.","Lunch":"**Aguachile negro on tortilla chips** — Fridge-thawed shrimp 125 g: if raw, poach 60–90 s in salted simmering water until just opaque, ice-bath 2 min, drain and pat dry; if pre-cooked, skip that. Butterfly each shrimp lengthwise. Toast ~1 g **chiltepín** (about 10 dried pods; start with 6 and add more) in a dry pan 15–20 s until dark and smoky (open the window), then crush it to a coarse powder. Whisk 40 ml lime juice with 15 ml soy sauce, the chiltepín, ½ sweetener tablet, 3 drops apple vinegar and lots of cracked black pepper: this is the black aguachile sauce. **Taste a drop first: chiltepín is brutally hot.** Pour it over the shrimp and cure 10–15 min in the fridge. Add 40 g red onion in thin slivers (soaked 10 min in ice water) and 150 g cucumber in half-moons, scatter 5 g cilantro, and eat ice-cold piled on 45 g tortilla chips.","Snack 2":"**Apfelschnitze mit Chili-Salz** — 1 Apfel (140 g), in Schnitze geschnitten und mit einer Prise Chiliflocken und Salz bestäubt, Mexican street-food style.","Dinner":"**Broccoli-egg Gouda toasts + peanut quark** — Steam 100 g TK broccoli covered with a splash of water 4 min, then add 5 ml rapeseed oil, chili flakes and paprika and fry until charred; push aside and scramble 1 egg (55 g) beside it. Make 2 sandwiches from 4 slices (150 g) Vollkorn-Sandwichtoast, the broccoli-egg and 30 g grated Gouda jung, and press in the pan 2–3 min a side until golden and melty. Dessert: Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet)."},"notes":[{"title":"Why this menu","text":"**Weekend treat, Saturday + Sunday only (the only menu that is not a full week).** Lunch is a black aguachile: 125 g shrimp (GOLDEN SEAFOOD TK, €7,99 per 720 g, assumed ~500 g net after glaze `[INFERENCE]`) cured in lime and soy with **chiltepín as the one chili**, over tortilla chips. The rest of the day keeps the plan complete: quark, eggs, seeds, broccoli and Gouda. Fresh produce (cucumber, red onion, limes, cilantro) isn't listed online, so those prices are estimates. Chiltepín is a non-Aldi spice-shop buy (~€9,50 `[INFERENCE]`, pack size unconfirmed): ~1 g a portion, so one pack lasts many weekends."},{"title":"Shrimp safety","text":"Thaw only in the fridge: shrimp in a covered box on the bottom shelf overnight, never on the counter or in warm water. Check the GOLDEN SEAFOOD pack for 'roh' vs 'gekocht' – raw is grey-translucent, cooked is pink-opaque. Raw: poach 60–90 s in salted, barely simmering water until just opaque and curled into a loose C, then straight into ice water for 2 min; lime alone does NOT make raw shrimp safe. Pre-cooked: skip poaching. Keep everything cold, cure in the fridge 10–15 min and eat within 30 min. Use thawed shrimp within 24 h, never refreeze, bin anything smelling of ammonia. Wash board, knife and hands after raw shrimp."},{"title":"Weekend schedule","text":"Friday (or Saturday morning): buy fresh produce – 3 limes, 1 large cucumber (≥300 g), 1 red onion, 1 bunch cilantro (stand it in a glass of water in the fridge), 4 Äpfel. Friday night: move Saturday's 125 g frozen shrimp to the fridge. Saturday morning: boil 4 eggs 9 min, ice-bath, fridge (2 snack eggs per day). Start lunch 30 min ahead; slice the onion and soak 10 min in ice water. Saturday night: move Sunday's shrimp to the fridge."},{"title":"Kit","text":"1 pot for poaching shrimp and boiling eggs; 1 pan with lid for toasting chiltepín, sunflower seeds, broccoli, eggs and toasts; mortar or the back of a spoon for crushing the chiltepín; bowl of ice water, slotted spoon, kitchen scale, citrus squeezer or fork, and a chilled bowl – aguachile should hit the table fridge-cold. Wash hands after handling chiltepín; do not touch your eyes."}]},{"id":"K","name":"Oven fries, pork steak & sunny-side eggs","knob":"porkXXL","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":220,"broccoli":150,"sunflower":35,"potato":350,"porkXXL":114},"mealOf":{"eggs":"Lunch","oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":75},"lock":{"bread":150,"oil":25,"veg":0,"solveKnob":false},"hue":55,"family":"potato","meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Crispy oven fries with pork steak, sunny-side eggs & roast broccoli** — Scrub 350 g potatoes, leave the skin on and cut into 1 cm sticks. Simmer them 5 min in salted water with a splash of apple vinegar until the edges just give, drain, and steam-dry in the colander 5 min, shaking once to rough up the surfaces (the fluffy crust is what crisps). Put a tray in the oven at 230 °C fan for 10 min. Toss the potatoes in 20 ml rapeseed oil, salt and ½ tsp paprika, slide them onto the screaming-hot tray in a single layer with gaps, and bake 25–30 min, turning once at 15 min, until deep golden. Toss 150 g thawed TK broccoli in the oil left in the bowl and add it to the tray for the last 12 min. Meanwhile slice 114 g Schwein-Minutensteaks thin, salt and pepper them, sear 90 s a side in a hot pan with 5 ml oil, push aside and fry 4 eggs (220 g) sunny-side up, lid on for 30 s. Eat with 25 g ketchup.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 2 slices (75 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with 1 apple (70 g)."},"notes":[{"title":"Why this menu","text":"**Oven fries with pork steak and eggs.** Potatoes are the cheapest calories in the plan (~€1/kg, INFERENCE). The oil question: America's Test Kitchen's crispiest oven fries use 90 ml oil for ~800 g of potatoes (11 ml per 100 g, ~800 kcal of oil); this menu uses 20 ml for 350 g (5,7 ml per 100 g, ~175 kcal) and gets its crunch from the parboil-with-vinegar, steam-dry, preheated-tray method instead (a parboil-first method The Kitchn tested in its 7-way oven-fries comparison; its result was not verified here, so expect crisp-edged rather than deep-fried). Pork Minutensteaks XXL 800 g ÷ 7 = 114 g a day: exactly one pack a week. Toast is cut to 4 slices a day to pay for the oil."},{"title":"Weekly schedule","text":"Potatoes: 350 g × 7 = 2,45 kg, one 2,5 kg bag a week (keeps ~3 weeks cool and dark). Pork: portion the 800 g pack into 114 g bags, freeze 5 flat, fridge 2; thaw ~24 h before. Eggs: 4 a day = 28 a week, two 18-packs. TK broccoli thaws overnight in the fridge. Leftover fries reheat 8–10 min at 220 °C on a hot tray, not in the microwave."},{"title":"Ketchup","text":"Ketchup adds ~27 kcal a day, not in the totals. Quark is eaten sweet only."}]},{"id":"L","name":"Mash with pork steak, bacon & eggs","knob":"porkXXL","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":110,"broccoli":100,"sunflower":35,"potato":350,"butter":15,"bacon":40,"porkXXL":114},"mealOf":{"eggs":"Lunch","bacon":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":150},"lock":{"bread":225,"oil":0,"veg":0,"solveKnob":false},"hue":80,"family":"potato","meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Butter mash with pork steak, crispy bacon, charred broccoli & hard-boiled eggs** — Wash 350 g potatoes, peel them if the skin is thick, and cut into 3 cm chunks. Cover with cold salted water, bring to the boil and simmer 15–20 min until a knife slides in. Drain (keep a cup of the water), return to the hot pot 3 min to steam-dry, then mash with a masher or ricer; stir in 15 g butter, ~50 ml of the hot potato water, salt, white pepper and a pinch of nutmeg until creamy (don't blend: it turns gluey). Meanwhile cut 40 g Bacon-Streifen into 1 cm pieces and render in a cold pan, rising to medium, 4–5 min until crisp; lift the bits out. In the bacon fat sear 114 g Schwein-Minutensteaks, sliced thin and salted, 90 s a side on high heat, then push aside and char 100 g thawed TK broccoli 3 min. Pile the mash, pork, broccoli and bacon bits on a plate with 2 hard-boiled eggs (110 g), quartered, on the side.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 4 slices (150 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with 1 apple (70 g)."},"notes":[{"title":"Why this menu","text":"**Mashed potatoes with pork steak, bacon and hard-boiled eggs (cut to €4,63/day on 2026-10-29).** The first version (85 g bacon, 5 eggs) cost €5,10 because bacon (€45 per kg of protein) and eggs (€32) carried the protein; pork Minutensteaks cost €25,5 per kg of protein, so the pork now does the work and the bacon is flavour (40 g). Butter is sized to the calorie window: BBC Good Food's creamy mash uses ~6,5 g butter + 5 ml milk per 100 g potato (1 kg: 50 g + 1 tbsp butter, 50 g milk); here it is 15 g for 350 g (4,3 g per 100 g, 112 kcal) and the potato cooking water replaces the milk. 6 toast slices pay for the calories the lean lunch leaves free."},{"title":"Weekly schedule","text":"Potatoes: 350 g × 7 = 2,45 kg, one 2,5 kg bag a week. Pork: 114 g × 7 = 798 g, exactly one 800 g XXL pack; portion into 114 g bags, freeze 5 flat, fridge 2, thaw ~24 h before. Bacon: 40 g × 7 = 280 g, one 300 g pack (opened bacon keeps ~7 days). Eggs: 14 a week, one 18-pack; boil 14 on Sunday, unpeeled in the fridge. Butter: 105 g a week, one 250 g pack lasts ~2,4 weeks."},{"title":"Label check","text":"Butter is a CONFIRMED Aldi panel (744 kcal per 100 g); potatoes are the INFERENCE part. Quark is eaten sweet only."}]},{"id":"M","name":"Cheeseburger with onions & fried egg","knob":"beef","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"beef":140,"onion":150,"gouda":20,"eggs":165,"sunflower":35,"hamburgerBun":50},"mealOf":{"gouda":"Lunch","eggs":"Lunch","oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":150},"lock":{"bread":225,"oil":5,"veg":0,"solveKnob":false},"hue":355,"family":"beef","meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Double smash cheeseburger with onions & a fried egg** — Slice 150 g onions thin and cook them 12–15 min in 5 ml rapeseed oil on medium with a pinch of salt and a splash of water, stirring, until soft and golden; set aside. Roll 140 g Hackfleisch vom Rind (~19% fat) into 2 loose balls of 70 g, no kneading. Halve 1 Hamburger-Brötchen (50 g) and toast it cut-side down in a dry pan 1 min. Heat the pan very hot with no oil, put in the 2 balls, smash each flat to ~1 cm with a spatula and salt the top; cook 2 min, flip, lay a 20 g slice of Gouda jung on one patty, stack the other on it and cover 30–60 s until melted. The mince must be cooked through (grey-brown inside, 71 °C): never pink. In the beef fat fry 1 egg (55 g) sunny-side up, lid on for 30 s. Build: bun base, onions, patties with cheese, egg, bun top; mustard or ketchup if you like. Eat 2 hard-boiled eggs (110 g) from the Sunday batch alongside.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 4 slices (150 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with 1 apple (70 g)."},"notes":[{"title":"Why this menu","text":"**A burger day: beef, onions, cheese, bun.** Hackfleisch vom Rind 500 g (MEINE METZGEREI, €5,79, CONFIRMED panel: 243 kcal, 18,9 g fat, 18,2 g protein per 100 g, so ~80% lean) is the dearest protein in the plan, €63,6 per kg of protein against €25,5 for pork Minutensteaks. Three eggs (1 fried on the burger, 2 boiled alongside) carry the rest of the protein; without eggs the patty would need 250 g and the day would cost €6,01 instead of €5,16. The bun is a real Hamburger-Brötchen (Aldi, 300 g / 6 buns = 50 g each, €0,99, €3,30/kg, 286 kcal and 3 g fiber per 100 g, panel supplied by the user): cheaper per kg than Brioche Burger Brötchen (€1,69 / 300 g) and than the toast, and it is the only bread that keeps it a hamburger. Fiber sits at 31,1 g, only just above the 30 g floor, so keep the 150 g of onions. Mixed mince (Hackfleisch gemischt, €4,99 / 500 g) would save ~€0,22/day but is not beef."},{"title":"Weekly schedule","text":"Beef: 140 g × 7 = 980 g, two 500 g packs a week (20 g spare). Mince keeps only ~2 days in the fridge: on shopping day weigh both packs into 7 portions of 140 g (each as 2 loose 70 g balls), keep 2 in the fridge and freeze 5 flat in bags; thaw each overnight in the fridge. Buns: 7 a week = 2 packs of 6 (5 spare), freeze the spare buns. Onions: 1,05 kg a week, one 1,5 kg bag lasts ~10 days. Eggs: 21 a week; boil 14 on Sunday for the side, fry 7 fresh. Gouda: 140 g a week. Toast: 6 slices a day at breakfast and dinner."},{"title":"Food safety","text":"Ground beef is cooked through, not rare: grey-brown, no pink, juices clear (71 °C). Wash hands, board and spatula after the raw mince. Smashed 1 cm patties cook through in 2 min a side; do not make thick, rare patties from supermarket mince."},{"title":"Quark","text":"Quark is eaten sweet only."}]},{"id":"P","name":"Sticky coconut mango rice, soy-ginger pork & broccoli (rice cooker)","knob":"porkXXL","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":110,"coconutMilk":100,"broccoli":200,"sunflower":35,"porkXXL":114,"jasmine":100,"gouda":30,"mango":100},"mealOf":{"eggs":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":75},"lock":{"bread":150,"oil":0,"veg":0,"solveKnob":false},"hue":62,"family":"pork","meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Sticky coconut mango rice with soy-ginger pork & broccoli** — Rinse 100 g Jasmin rice (dry weight) until the water runs clear. Put it in the cooker pot with 100 ml Kokosnussmilch (shake the can first), 60 ml water, 3 sweetener tablets and a pinch of salt; stir until the tablets have dissolved, then start **SUSHI** (30 min, the program for sticky rice). Meanwhile slice 114 g Schwein-Minutensteaks into 1 cm strips, toss them in 1 tsp soy sauce and ½ tsp ground ginger, and sear them 2 min in a very hot dry non-stick pan until browned and white-grey all through; add 200 g thawed TK broccoli and toss 2 min. When the display says WARM, let the rice rest 10 min with the lid shut, then fluff it with a wooden or plastic spoon and press it into a bowl so it clumps. Peel and dice 100 g ripe mango and lay it on the rice; pack 2 hard-boiled eggs (110 g) from the Sunday batch alongside.","Dinner":"**Peanut-cinnamon quark with cheese toast & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 2 slices (75 g) Vollkorn-Sandwichtoast; grate 30 g Gouda jung over them and grill until bubbling and golden. Eat the cheese toast and the sweet quark side by side, and finish with 1 apple (70 g) for dessert."},"notes":[{"title":"Why this menu","text":"**A sweet coconut rice lunch with mango, cooked in the Reishunger.** The rice cooks in 100 ml coconut milk + 60 ml water with **3 Süßstofftabletten** (the SÜSSLI 1.200 pack already in the plan: cyclamate + saccharin, 0 kcal) on the SUSHI program (30 min, 1 : 1,25, Reishunger: for creamy, sticky rice) and is finished with fresh mango, like Thai mango sticky rice; the salty side is the soy-ginger pork. **Honest limit:** real sticky rice (Klebreis, short-grain glutinous) is not in Aldi's online range, and neither is mango (fresh produce is not listed; mango nutrition 60 kcal / 0,8 g protein / 1,6 g fiber per 100 g and €3/kg are `[INFERENCE]`). Jasmine is long-grain, so it will be clumpy and creamy, not truly glutinous; if you find Klebreis (Asian shop, needs a 4–12 h soak per Reishunger's table), use it with the same amounts. **Sweetness:** the Aldi page doesn't print the sweetness per tablet; about 1 tsp of sugar each is typical `[INFERENCE]`, so 3 tablets ≈ 15 g of sugar. Taste the cooked rice and use 4–5 next time if you want it sweeter. Cyclamate and saccharin are stable when heated `[INFERENCE]`, and unlike sugar they cannot scorch on the pot bottom. Tablet budget: the plan's cyclamate limit works out at ~29 tablets a day at your weight, and this day uses ~7 (coffee 2, quark 2, rice 3). **Coconut milk is this menu's calorie cost:** 208 kcal and 17 g saturated fat per 100 ml (Aldi panel, CONFIRMED). Mango adds ~60 kcal and ~6 g sugar. The toast is cut to 4 slices to pay for both, and the 17 g of saturated fat in 100 ml is about two-thirds of the usual ≤10 %-of-energy limit (~26 g at 2350 kcal) `[INFERENCE]`. Lighter version: Kokosnussmilch fettreduziert (same €1,19; 118 kcal and 12 g fat per 100 ml) plus one more toast slice (+90 kcal) gives about the same calories, ~5 g less saturated fat `[INFERENCE]` and ~2 g more protein. The main is Schwein-Minutensteaks XXL, 800 g ÷ 7 = 114 g a day. The day: 2425 kcal, 157 g protein, 31,9 g fiber. A flan or cheesecake instead of the 2 eggs: see the Treats tab."},{"title":"Weekly schedule","text":"Pork: buy the 800 g XXL pack = 7 × 114 g. Portion into flat bags, 2 in the fridge and 5 frozen; thaw ~24 h before. Rice: 100 g dry a day, 700 g a week, so one 1 kg bag lasts 10 days; cook it the evening before for a cold-carry lunch (chilled within 1 h, packed straight from the fridge with a frozen cool pack) or in the morning for a thermos lunch (preheat the thermos 5 min with boiling water, fill it piping hot, eat within ~4 h while above 60 °C). **Coconut milk: 100 ml a day is 700 ml, so the second 400 ml can leaves 100 ml over each week.** Open can 1 on day 1, shake it and decant it into a jar in the fridge (days 1–4); open can 2 on day 5 (days 5–7) and freeze the last 100 ml in a small box the same day. After four weeks the frozen boxes add up to one can, so that week buy one can instead of two. An opened can keeps about 4–5 days in the fridge and frozen coconut milk separates but cooks normally `[INFERENCE]`. Mango: 100 g a day is 700 g a week, about 2–3 fruits of ~300 g edible; a ripe mango keeps ~5 days, so buy 1 at a time or freeze diced pieces. Eggs: boil 14 on Sunday, unpeeled in the fridge. TK broccoli (200 g) thaws overnight in the fridge."},{"title":"Your cooker: Reishunger Mini 0.6 L","text":"**What the manual says.** Programs: STANDARD and WHITE 26 min, BROWN 62 min, SUSHI 30 min, CRISPY, CONGEE, STEAM, BAKING; keep-warm up to 24 h; maximum 3,5 cups of white rice. Reishunger's rice table gives **Jasmin and Basmati rice 1 : 1,25 on WHITE (26 min)** and brown rice 1 : 1,75, in measuring cups of rice : cups of water. **This menu uses Aldi's BON-RI Jasmin Reis** (1 kg, €1,99, ~€0,06 a day more than parboiled) because it is on that table; parboiled rice, which menu E uses for its fried rice, is not. Weigh one level measuring cup of dry rice once to learn how many grams a cup holds. My gram and ml figures assume jasmine rice weighs ~0,8 g per ml `[INFERENCE]`: 100 g ≈ 125 ml of rice, so ~155 ml of liquid (100 ml coconut milk + 60 ml water). Reishunger says a one-person portion cooks evenly. Wooden or plastic spoon only (ceramic coating), no vinegar in the pot, no dishwasher. **Steam insert** (included): with rice in the pot use at most 1 cup of rice, or the basket can be pushed up and the lid pops open; steam only food ≤3,5 cm thick; no paper towels or extra lids (they can block the steam valve), foil is fine (the manual wraps fish in it); open the lid slowly, the steam is hot. **No delay timer** with raw meat or coconut milk in the pot: the manual warns against long timers with perishables. **Reishunger does not recommend milk rice, risotto or paella rice in this cooker.** The coconut rice here is long-grain jasmine rice in coconut milk and water, a pilaf, not a milk rice. **Safety (B. cereus).** Spores survive boiling and the toxin survives reheating, so cooked rice is kept either ≥60 °C or chilled to ≤4 °C (Singapore Food Agency). The manual allows keep-warm for 24 h but gives no temperature `[INFERENCE: unverified]`, so the rule stays: eat from keep-warm only if the rice is still steaming when you lift the lid, within ~4 h; otherwise spread it flat, fridge within 1 h, eat within 3 days, and reheat once in a pan or microwave until steaming throughout (not on keep-warm)."},{"title":"Label check","text":"Jasmin Reis: BON-RI 1 kg (the Basmati page on aldi-sued.de has a typo in its protein row, so use the Jasmin panel: 350 kcal, 6,8 g protein). Kokosnussmilch: the can should list coconut and water (guar gum is fine) and no sugar; 'fettreduziert' is a separate Aldi product. Soy sauce: KIKKOMAN naturally brewed (water, soybeans, wheat, salt). Minutensteaks: plain 'natur', not marinated or 'gewürzt'. Quark is eaten sweet only."}]},{"id":"Q","name":"Carnitas with frijoles refritos & salsa de chiltepín","knob":"porkGulasch","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"proteinWrap":120,"porkGulasch":142,"kidney":145,"hirtenkaese":35,"spitzpaprika":60,"tomato":70,"onion":40,"cilantro":4,"lime":10},"lock":{"bread":150,"oil":10,"veg":0,"solveKnob":false},"hue":335,"family":"pork","mealOf":{"oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":75},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Carnitas tacos de harina with frijoles refritos, queso fresco & salsa de chiltepín tatemada** — Carnitas: take one portion of the Sunday batch (142 g raw Gulasch vom Schwein, braised and pulled, see the notes) and crisp it 4–5 min in a hot pan with 5 ml rapeseed oil, pressed flat and turned once, until the edges are dark gold (or 5 min in the air fryer at 200 °C); grind black pepper over. Frijoles: chop 40 g onion fine and keep half of it raw. Soften the other half 3 min in 5 ml oil, add 145 g drained kidney beans, 3 tbsp water and a pinch of salt, mash with a fork (or blitz with the stick blender) and fry 3–4 min, stirring, until the paste holds a line when you drag the spoon through it; crumble 35 g Hirtenkäse over the top. Rajas: cut 60 g pointed red pepper into strips and blister them 6 min in the air fryer at 200 °C (or in a dry pan). Salsa: char 70 g Datteltomaten and 1 unpeeled garlic clove 8–10 min in the air fryer at 200 °C until black in spots, peel the garlic, and blend both with the stick blender with ~0,5 g **chiltepín** (about 5 pods, toasted and crushed; start with 3) and a pinch of salt. Warm 3 Protein-Wraps (120 g) 20 s a side in a dry pan, fill them with beans, carnitas and pepper strips, and top with the raw onion, 4 g chopped cilantro and 10 ml lime juice; spoon the salsa on as you eat.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 2 slices (75 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with half an apple (70 g)."},"notes":[{"title":"Why this menu","text":"**Carnitas from the cheapest fresh meat protein at Aldi.** Gulasch vom Schwein XXL costs €4,99/kg with 21 g protein per 100 g (€23,8 per kg of protein), and one 1 kg pack is exactly 7 × 142 g. Michoacán carnitas are pork shoulder and belly cooked slowly in lard (Casa de México: 1,5 kg pork and 500 g belly in 1 kg lard, with orange, milk, garlic and bay, about 1 h 50); this pack is cut from the leg, 4 % fat, and is braised in water with garlic and bay, then crisped in 5 ml oil. It is leaner and drier than taquería carnitas, so the crisping, the beans and the salsa are not optional. Four cans of kidney beans are 7 × 145 g; one pack each of Hirtenkäse (7 × 35 g), Datteltomaten (7 × 70 g) and pointed peppers (7 × 60 g of ~440 g edible) covers the week. Aldi lists no corn tortillas, so these are tacos de harina on Protein-Wraps. The menu has no eggs. Lime, cilantro and garlic are not listed online: their prices are estimates. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~15 mg, zinc ~15 mg, calcium ~900 mg, magnesium ~510 mg, vitamin C ~100 mg, folate ~400 µg; calcium and vitamin C sit a little under the DGE figures (1000 mg, 110 mg)."},{"title":"Weekly schedule","text":"**Sunday, carnitas for the week:** cut the 1 kg of Gulasch into ~4 cm pieces, put it in a pot with 1 tsp salt, 4 peeled garlic cloves, 300 ml water and 1 bay leaf per 500 g; lid on, barely simmer 60–75 min until a piece pulls apart with a fork (leg meat turns dry if it boils hard). Take the lid off, cook the liquid away, pull the meat into rough shreds, weigh it and split it into 7 equal boxes: each is one 142 g raw portion. Fridge for Sun–Wed, freeze Thu–Sat flat. **Beans:** all 4 cans can be mashed and fried in one go with 140 g onion and 35 ml oil (7 portions; fridge 4, freeze 3) and the Hirtenkäse crumbled on when you reheat. **Salsa:** make it on Sunday and again on Wednesday or Thursday from 245 g Datteltomaten, 3 garlic cloves and ~1,5 g chiltepín; it keeps 4 days in a closed jar in the fridge. **Wraps:** 21 a week is 3 packs of 8; freeze the 3 spare."},{"title":"Carry to uni","text":"The evening before: crisp the carnitas, warm the wraps, spread each with beans and cheese, add the carnitas and pepper strips, roll them closed and wrap each in foil; fridge overnight. Whatever beans do not fit go in the lunch box as a side. Stir the raw onion, cilantro and lime juice into the salsa and carry it in a small jar, so the wraps stay dry until you eat. On days at home, eat them hot as open tacos."},{"title":"Food safety","text":"Pork must be cooked through: no pink, juices clear. Cool cooked meat and beans spread out and box them in the fridge within 1 h; eat fridge portions within 3 days and freeze the rest flat on the day they are cooked. Thaw frozen portions in the fridge overnight, reheat once only, until steaming throughout. A carried lunch leaves the fridge with a frozen cool pack and is eaten within ~4 h; bin what is left."},{"title":"Air fryer & chiltepín","text":"The air-fryer times are estimates `[INFERENCE]` for a basket of 5 L or more and have not been tested on your model: look at the lower time and go by colour. Chiltepín is brutally hot: start with the smaller number of pods, taste a drop, then add. Toast the pods 15 s in a dry pan (open the window), crush them with the back of a spoon, wash your hands and keep them away from your eyes."}]},{"id":"S","name":"Discada norteña burritos with frijoles & salsa macha","knob":"porkGulasch","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"proteinWrap":120,"porkGulasch":71,"bratwurst":42,"bacon":40,"kidney":145,"saureSahne":28,"spitzpaprika":60,"tomato":70,"onion":40,"mozzarella":35},"lock":{"bread":150,"oil":5,"veg":0,"solveKnob":false},"hue":305,"family":"pork","mealOf":{"oil":"Lunch","appleSnack":"Dinner","bacon":"Lunch"},"breadMeals":{"Breakfast":75,"Dinner":75},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Discada norteña burritos with frijoles puercos, crema & salsa macha** — Cut 40 g Bacon-Streifen into 2 cm pieces, start them in a cold wide pan and render 5 min on medium until crisp; push them to the edge. On high heat brown 71 g Gulasch vom Schwein, cut into 1,5 cm cubes and salted, 6–8 min in the bacon fat; push it aside. Brown 42 g Schweine-Bratwurst in 5 mm coins 3–4 min. Add 40 g onion and 60 g pointed red pepper, both diced, and fry 3 min, then stir everything together with 70 g Datteltomaten, chopped, 1 chopped garlic clove and 4 tbsp water; simmer 10–15 min until the liquid is thick and the pork is tender, and season with black pepper (the bacon and sausage bring the salt). Frijoles puercos: spoon 1 tsp of the fat from the pan into a small pot, add 145 g drained kidney beans and 3 tbsp water, mash with a fork (or the stick blender), fry 3–4 min and melt 35 g Mozzarella gerieben into them. Warm 3 Protein-Wraps (120 g) 20 s a side in a dry pan, spread them with the beans, add the discada, 28 g Saure Sahne and 1 tbsp salsa macha (5 ml of oil; the batch recipe is in the notes), and roll them up.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 2 slices (75 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with half an apple (70 g)."},"notes":[{"title":"Why this menu","text":"**The northern mixed-meat fry, rolled into burritos.** A discada is cooked on a plough disc from several meats at once; Grileros in Monterrey uses 500 g beef, 500 g pork, 300 g sausage and 200 g bacon with tomato, bell pepper, onion and garlic for 8–10 people. Here the meat is all pork (beef costs three times as much at Aldi) and Bratwurst stands in for the salchicha and chorizo: 71 g Gulasch, 42 g Bratwurst and 40 g bacon a day. The beans are frijoles puercos in the Sinaloa manner, fried in the pork fat with melting cheese, without the chorizo and pickled chiles of the original. **Packs:** the bacon (7 × 40 g), mozzarella (7 × 35 g), Saure Sahne (7 × 28 g), Datteltomaten, pointed peppers and 4 cans of beans are used up each week; the 1 kg Gulasch pack and the 600 g Bratwurst pack each last **two weeks** (14 × 71 g, 14 × 42 g), so half of each is frozen on shopping day. The menu has no eggs. Garlic is not listed online: its price is an estimate. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~15 mg, zinc ~14 mg, calcium ~1010 mg, magnesium ~500 mg, vitamin C ~100 mg, folate ~390 µg; zinc and vitamin C sit a little under the DGE figures (16 mg, 110 mg)."},{"title":"Weekly schedule","text":"**Shopping day:** freeze half of the Gulasch (500 g) and half of the Bratwurst (300 g) for next week. The discada reheats well, so cook it in two batches: Sunday for 4 days (284 g Gulasch, 168 g Bratwurst, 160 g bacon, 160 g onion, 240 g pointed pepper, 280 g Datteltomaten, 4 garlic cloves) and Wednesday evening for 3 days (213 g, 126 g, 120 g, 120 g, 180 g, 210 g, 3 cloves); weigh each batch and split it evenly. **Beans:** all 4 cans can be mashed and fried on Sunday (7 portions; fridge 4, freeze 3); melt the mozzarella in when you reheat. **Wraps:** 21 a week is 3 packs of 8; freeze the 3 spare."},{"title":"Salsa macha","text":"**One jar lasts three weeks.** The model is the Oregon State University Extension recipe: 1 cup oil, 10 garlic cloves, 15 chiles de árbol and 2 moritas, ½ cup peanuts, 2 tbsp sunflower seeds, 1 tbsp vinegar and ¼ tsp salt, kept up to a month in the fridge. With what Aldi sells: warm 105 ml rapeseed oil on medium-low and fry 4 sliced garlic cloves 2–3 min until pale gold. Take the pan off the heat and stir in 2 tbsp chili flakes and 1 tsp crushed chiltepín (they scorch in seconds: the oil must not smoke), then 30 g sunflower seeds from the breakfast bag, 1 tbsp apple vinegar and ½ tsp salt. Pulse 3–4 times with the stick blender so it stays coarse. That is 21 portions of 1 tbsp; each carries the 5 ml of oil counted in this day, plus ~1,5 g of seeds (~10 kcal) that are not in the totals. Keep the jar in the fridge and use a clean spoon."},{"title":"Carry to uni","text":"The evening before: reheat a portion of discada and of beans until steaming, fill and roll the 3 burritos with the Saure Sahne and salsa macha inside, wrap each in foil and put them in the fridge. They are eaten cold; the foil keeps them closed."},{"title":"Food safety","text":"Pork must be cooked through: no pink, juices clear. Cool cooked meat and beans spread out and box them in the fridge within 1 h; eat fridge portions within 3 days and freeze the rest flat on the day they are cooked. Thaw frozen portions in the fridge overnight, reheat once only, until steaming throughout. A carried lunch leaves the fridge with a frozen cool pack and is eaten within ~4 h; bin what is left."}]},{"id":"T","name":"Dogos estilo Sonora with frijoles & chile toreado","knob":"bratwurst","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"bratwurst":200,"bacon":40,"hotDogBun":125,"kidney":145,"hirtenkaese":35,"spitzpaprika":60,"tomato":70,"onion":40,"chipotleMayo":10},"lock":{"bread":75,"oil":0,"veg":0,"solveKnob":false},"hue":22,"family":"pork","mealOf":{"oil":"Lunch","appleSnack":"Dinner","bacon":"Lunch"},"breadMeals":{"Breakfast":75},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Dogos estilo Sonora with frijoles, queso & chile toreado** — Wrap each of 2 Schweine-Bratwürste (200 g) in 2 strips of Bacon-Streifen (40 g in all), spiralling from one end to the other so the bacon covers the sausage. Lay them seam-side down in a cold pan and cook on medium 12–14 min, turning every 2–3 min, until the bacon is deep brown and the sausage is cooked through (no pink inside), or 12 min in the air fryer at 180 °C, turned once. Dice 40 g onion; soften half of it 4 min in the bacon fat and keep the other half raw. Warm 145 g drained kidney beans with 3 tbsp water, a pinch of salt and black pepper and crush them roughly with a fork. Blister 60 g pointed red pepper, whole or in wide strips, 5–6 min in the air fryer at 200 °C (or in the dry pan) and salt it: that is the chile toreado. Dice 70 g Datteltomaten. Warm 2 Hot-Dog-Brötchen (125 g) 2 min in the air fryer at 160 °C and slit them along the top without cutting through. Build each: sausage, beans, cooked onion, raw onion, tomato, a line of mustard, 5 g Chipotle-Mayo (10 g in all) and half of 35 g crumbled Hirtenkäse. Crush 3–4 **chiltepín** pods over the top and eat the chile on the side.","Dinner":"**Peanut-cinnamon quark with apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Dice half an apple (70 g) over the top. No toast tonight: the two buns at lunch are the day's bread."},"notes":[{"title":"Why this menu","text":"**The Sonoran hot dog: a bacon-wrapped sausage in a soft bun under beans, two kinds of onion, tomato, mustard, mayonnaise and salsa, with a blistered chile on the side.** The model is El Güero Canelo's recipe as published by Pati Jinich (for 4: 4 slices of bacon, 4 sausages, 1 cup chopped onion cooked in the fat, 4 chiles güeros, 4 buns, 1 cup pinto beans; on top raw onion, tomato, jalapeño salsa, mustard and mayonnaise). **Bratwurst, not wieners:** Aldi's Hot Dogs (375 g, €2,99) have 13 g protein per 100 g at €7,97/kg against 18 g at €4,48/kg for the Schweine-Bratwurst, and with wieners the day cannot reach its protein inside the calorie ceiling. Kidney beans stand in for pintos, the pointed red pepper for the chile güero, Hirtenkäse for cotija, and crushed chiltepín for the jalapeño salsa. This is the plan's richest lunch (about 1280 kcal), so the day has only the 2 breakfast toast slices and 10 g of mayonnaise; do not add more. **Packs:** bacon (7 × 40 g), Hirtenkäse (7 × 35 g), 4 cans of beans, Datteltomaten and the peppers are used up in the week; 14 sausages are 1400 g, so buy 7 packs of Bratwurst for 3 weeks and freeze what is not for the next 2 days. The 250 g bun pack holds 4 buns of 62,5 g (you checked), so 14 buns are 3½ packs; freeze the spare half pack. **Still to check on the pack:** how many sausages are in the 600 g Bratwurst pack (6 of ~100 g assumed `[INFERENCE]`; the Aldi page does not say). The bun panel lists no fiber; 2,5 g per 100 g is a reference value. Chipotle-Mayo is weighed in grams (the 250 ml bottle holds roughly 235 g `[INFERENCE]`); it is the only chipotle product Aldi lists. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~13 mg, zinc ~14 mg, calcium ~900 mg, magnesium ~445 mg, vitamin C ~100 mg, folate ~380 µg; zinc, calcium and vitamin C sit a little under the DGE figures (16 mg, 1000 mg, 110 mg)."},{"title":"Weekly schedule","text":"Shopping day: keep 4 Bratwürste in the fridge (2 days) and freeze the rest in pairs; move a pair to the fridge the evening before. Bacon keeps about a week once opened, which is this menu. The buns go stale within days: freeze them on shopping day and warm them from frozen, 3–4 min in the air fryer at 160 °C. Beans: all 4 cans can be crushed and warmed in one go (7 portions; fridge 4, freeze 3). Onion, tomato and the pepper are cut fresh each day; it takes 5 min."},{"title":"Carry to uni","text":"A built dogo does not travel: the bun soaks through. On uni days cook the wrapped sausages the evening before and carry them cold in a box with the beans, the cut onion and tomato in a second small box, and the buns in their bag; build them when you eat. The mustard and mayonnaise go on at home onto the sausage, not the bun. Best on days at home, straight from the pan."},{"title":"Food safety","text":"Pork must be cooked through: no pink, juices clear. Cool cooked meat and beans spread out and box them in the fridge within 1 h; eat fridge portions within 3 days and freeze the rest flat on the day they are cooked. Thaw frozen portions in the fridge overnight, reheat once only, until steaming throughout. A carried lunch leaves the fridge with a frozen cool pack and is eaten within ~4 h; bin what is left."},{"title":"Chiltepín","text":"Chiltepín is brutally hot: start with 2 pods per dogo, taste, then add. Crush them between your fingers over the food, then wash your hands and keep them away from your eyes."}]},{"id":"U","name":"Tacos de pescado zarandeado","knob":"pangasius","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"pangasius":192,"proteinWrap":120,"chipotleMayo":20,"spitzpaprika":60,"cucumber":100,"redOnion":30,"lime":10},"lock":{"bread":262.5,"oil":5,"veg":0,"solveKnob":false},"hue":200,"family":"seafood","mealOf":{"oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":187.5},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Tacos de pescado zarandeado with cebolla morada, pepino & chile asado** — Thaw 192 g Pangasius-Filet overnight in the fridge and pat it very dry. Marinade: mix 20 g Chipotle-Mayo with 1 tsp mustard, 2 tsp soy sauce, 1 grated garlic clove, 1 tsp Paprika edelsüß, ½ tsp oregano, 5 ml lime juice, black pepper and 2–3 crushed **chiltepín** pods. Coat the fish on both sides and leave it 20 min in the fridge (overnight is fine). Brush the air-fryer basket with 5 ml rapeseed oil, lay the fillets in one layer and cook 10–12 min at 200 °C without turning, until the edges are charred and the thickest part flakes (or 3–4 min a side in a very hot non-stick pan). Put 60 g pointed red pepper in strips beside the fish for the last 6 min. Slice 30 g red onion paper-thin and steep it in the other 5 ml lime juice with a pinch of salt; cut 100 g cucumber into sticks. Warm 3 Protein-Wraps (120 g) 20 s a side in a dry pan, break the fish into large flakes over them and top with the onion, cucumber and pepper strips.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 5 slices (187,5 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with half an apple (70 g)."},"notes":[{"title":"Why this menu","text":"**Pescado zarandeado, the Nayarit and Sinaloa grilled fish, as tacos.** On the coast a whole snapper is butterflied, painted with a marinade and grilled over coals in a hinged rack that is shaken (zarandeado). The marinade follows Directo al Paladar's home version, which also allows an air fryer: for 2 fillets 100 ml mayonnaise, 8 ml soy sauce or Maggi, 2 garlic cloves, oregano, lime, a guajillo and a chile de árbol, with achiote for the red colour or sweet paprika if there is none. Here the Chipotle-Mayo is mayonnaise and chile in one, paprika gives the colour and chiltepín the heat; with far less mayonnaise than the original (20 g), because it is the day's fattest ingredient. **Fish:** Pangasius (900 g TK, €5,49, 84 kcal and 17 g protein per 100 g) is the cheapest fillet Aldi lists and stays moist under high heat; 14 × 192 g is 2688 g, so **3 packs last two weeks**. The pack does not state how much of the 900 g is ice glaze: weigh a thawed, dried portion once `[INFERENCE]`. Fish is lean, so this day has 7 toast slices (2 at breakfast, 5 at dinner). Chipotle-Mayo is weighed in grams (the 250 ml bottle holds roughly 235 g `[INFERENCE]`); it is the only chipotle product Aldi lists. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~15 mg, zinc ~13 mg, calcium ~760 mg, magnesium ~530 mg, vitamin C ~90 mg, folate ~400 µg; zinc, calcium and vitamin C are under the DGE figures (16 mg, 1000 mg, 110 mg), calcium by the most, because the day has no cheese."},{"title":"Weekly schedule","text":"Move the next day's 192 g from the freezer to the fridge each evening and marinate it then, so it is ready to cook. The marinade for the week can be mixed once (140 g Chipotle-Mayo, 7 tsp mustard, 14 tsp soy sauce, 7 garlic cloves, 7 tsp paprika, 3½ tsp oregano, 35 ml lime juice) and kept 5 days in a jar in the fridge. The red onion in lime keeps 3 days. One cucumber covers 4 days; the peppers are one pack a week."},{"title":"Carry to uni","text":"Cook the fish the evening before, cool it and box it; carry it cold with a frozen cool pack, with the onion, cucumber and pepper strips in the same box and the wraps separate, and fill the tacos when you eat. Cold zarandeado is good; reheating it in a microwave dries it out."},{"title":"Fish safety","text":"Thaw the fillets overnight in the fridge in a covered box on the bottom shelf, never on the counter, and pour off the thaw water. Cook until the thickest part is opaque and flakes. Cooked fish keeps 2 days in the fridge; do not refreeze fish that was thawed raw. A carried lunch leaves the fridge with a frozen cool pack and is eaten within ~4 h; bin what is left. Wash board, knife and hands after raw fish."},{"title":"Air fryer & chiltepín","text":"The air-fryer times are estimates `[INFERENCE]` for a basket of 5 L or more and have not been tested on your model: look at the lower time and go by colour. Chiltepín is brutally hot: start with the smaller number of pods, taste a drop, then add. Toast the pods 15 s in a dry pan (open the window), crush them with the back of a spoon, wash your hands and keep them away from your eyes."}]},{"id":"V","name":"Tacos de chicharrón de panza with frijoles","knob":"porkBelly","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"porkBelly":85,"porkXXL":57,"kidney":145,"proteinWrap":120,"spitzpaprika":60,"tomato":70,"onion":40,"cilantro":4,"lime":10},"lock":{"bread":187.5,"oil":0,"veg":0,"solveKnob":false},"hue":8,"family":"pork","mealOf":{"oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":112.5},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Tacos de chicharrón de panza with maciza, frijoles & salsa de chiltepín tatemada** — Pat 85 g Schweine-Bauchscheiben dry, cut them into 2 cm pieces, salt them and spread them in one layer in the air-fryer basket: 18–22 min at 200 °C, shaken twice, until deep golden, blistered and crisp (pour off the fat in the drawer halfway and keep 1 tsp). For the last 8–10 min put 70 g Datteltomaten and 1 unpeeled garlic clove beside them to char, and 60 g pointed red pepper in strips for the last 6. Cut 57 g Schwein-Minutensteaks into strips, salt them and sear them 1–2 min in a very hot pan in the teaspoon of belly fat until browned and no longer pink: this is the lean maciza. Chop belly and steak together on the board, the way a taquero does. Salsa: peel the garlic and blend it with the charred tomatoes, ~0,5 g **chiltepín** (about 5 pods, toasted and crushed; start with 3) and a pinch of salt with the stick blender. Warm 145 g drained kidney beans with 3 tbsp water, salt and black pepper and crush them with a fork. Warm 3 Protein-Wraps (120 g) 20 s a side in a dry pan, spread them with the beans, add the chopped pork and the pepper strips, and top with 40 g onion, diced fine, 4 g chopped cilantro and 10 ml lime juice; spoon the salsa over.","Dinner":"**Peanut-cinnamon quark with toast soldiers & apple** — Whisk 25 g Erdnusscreme with 2 tbsp hot water, 1 sweetener tablet and a good pinch of cinnamon until loose, then fold through 250 g Magerquark until mousse-like (no salt, no soy: the quark stays sweet). Toast 3 slices (112,5 g) Vollkorn-Sandwichtoast, cut into soldiers and dip them, then finish with half an apple (70 g)."},"notes":[{"title":"Why this menu","text":"**Crisp pork belly in a taco, with a sharp salsa to cut the fat.** Schweine-Bauchscheiben (600 g, €4,99) have 293 kcal and only 17 g protein per 100 g, so belly alone cannot carry a day's protein inside the calorie ceiling. The taco is therefore ordered surtida, as at a carnitas stand: 85 g of crisp panza chopped together with 57 g of lean maciza (Schwein-Minutensteak). **Packs:** one belly pack is 7 × 85 g; the 800 g XXL steak pack is 14 × 57 g, so it lasts **two weeks** and half is frozen on shopping day; 4 cans of beans, one pack of Datteltomaten and one of peppers a week. No oil is added: the belly renders its own fat, and the calories are counted for the raw weight, so what you pour off is a margin in your favour. The air-fryer time follows a tested table for supermarket belly slices (The Scatty Mum: 17–20 min at 200 °C for thin slices, 20–25 for standard, 25–35 for thick); 2 cm pieces are at the short end `[INFERENCE]`. Estimates from USDA/BLS reference values `[INFERENCE]`: iron ~15 mg, zinc ~13 mg, calcium ~750 mg, magnesium ~510 mg, vitamin C ~100 mg, folate ~400 µg; zinc, calcium and vitamin C are under the DGE figures (16 mg, 1000 mg, 110 mg), calcium by the most, because the day has no cheese."},{"title":"Weekly schedule","text":"Shopping day: cut the belly pack into 7 × 85 g and the steak pack into 14 × 57 g; keep 2 of each in the fridge and freeze the rest flat, moving a portion of each to the fridge the evening before. The salsa can be made for 3–4 days at once (it keeps 4 days in a closed jar in the fridge). Beans: all 4 cans can be crushed and warmed in one go (7 portions; fridge 4, freeze 3). The chicharrón is best made fresh; the whole lunch takes about 25 min, most of it unattended."},{"title":"Carry to uni","text":"Chicharrón goes soft in a closed box. Either cook it in the morning (the air fryer does it while you get ready) and carry it in a box with a sheet of kitchen paper, or cook it the evening before and put it back in the air fryer for 3 min at 200 °C before you leave. Pack the beans, the pork, the salsa jar and the wraps separately and fill the tacos when you eat."},{"title":"Food safety","text":"Pork must be cooked through: no pink, juices clear. Cool cooked meat and beans spread out and box them in the fridge within 1 h; eat fridge portions within 3 days and freeze the rest flat on the day they are cooked. Thaw frozen portions in the fridge overnight, reheat once only, until steaming throughout. A carried lunch leaves the fridge with a frozen cool pack and is eaten within ~4 h; bin what is left."},{"title":"Air fryer & chiltepín","text":"The air-fryer times are estimates `[INFERENCE]` for a basket of 5 L or more and have not been tested on your model: look at the lower time and go by colour. Chiltepín is brutally hot: start with the smaller number of pods, taste a drop, then add. Toast the pods 15 s in a dry pan (open the window), crush them with the back of a spoon, wash your hands and keep them away from your eyes."}]},{"id":"W","name":"Gringas al pastor with piña","knob":"porkXXL","bread":"vollkornSandwich","dairy":"quark","dairyPerDay":500,"fixed":{"eggs":0,"sunflower":35,"porkXXL":114,"mozzarella":35,"pineapple":48,"proteinWrap":120,"tomato":70,"onion":40,"cilantro":4,"lime":10,"spitzpaprika":60},"lock":{"bread":262.5,"oil":5,"veg":0,"solveKnob":false},"hue":318,"family":"pork","mealOf":{"oil":"Lunch","appleSnack":"Dinner"},"breadMeals":{"Breakfast":75,"Dinner":187.5},"meals":{"Breakfast":"**Cinnamon emmer quark with toasted seeds** — Stir 50 g Emmerflocken into 250 g Magerquark with 3 tbsp water, cinnamon and 1 sweetener tablet (overnight in the fridge gives a softer set). Dry-toast 35 g sunflower seeds until they crackle and smell nutty, then dice half an apple (70 g) over the top. Toast 2 slices (75 g) Vollkorn-Sandwichtoast and drag them through the quark.","Lunch":"**Gringas al pastor with piña, chiles toreados & salsa de chiltepín tatemada** — The evening before, cut 114 g Schwein-Minuten
